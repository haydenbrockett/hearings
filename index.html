<style>
/* Layout: a hearing record — chapter index on the left, the record on the right; collapses to one column on phones. */
:root{

  --accent:#7db7de; --accent-soft:#1d3240; --mark:#6b5a12; --flag:#e3a64b; --flag-soft:#33281a; --ok:#6fd39a; --ok-soft:#173326; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:grid;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:650;font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0;text-wrap:balance}

@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
h2{font-family:var(--f-display);font-weight:650;font-size:21px;margin:0 0 12px}

.ch.on{border-color:var(--accent)}

.ch h3{font-family:var(--f-display);font-weight:650;font-size:17px;line-height:1.3;margin:0;text-wrap:balance;min-width:0}

.ch li{font-size:14px}
.ch-actions{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:2px}
.ts{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
button.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Suggested corrections */
.seg{position:relative}

.sugbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.sugbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.sugstate{font-size:13px;color:var(--muted)}
.suglist{display:grid;gap:10px}
.sug{border:1px solid var(--rule);border-left:3px solid var(--flag);border-radius:6px;padding:10px 12px;display:grid;gap:6px;background:var(--bg)}
.sug.accepted{border-left-color:var(--ok)} .sug.rejected{border-left-color:var(--rule);opacity:.8}
.sug-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:13px;color:var(--muted)}
.sug-head b{color:var(--fg);font-weight:600}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--flag-soft);color:var(--flag)}
.pill.accepted{background:var(--ok-soft);color:var(--ok)} .pill.rejected{background:var(--accent-soft);color:var(--muted)}
.sug .was,.sug .now{font-size:14px;white-space:pre-wrap;margin:0}
.sug .was{color:var(--muted)} .sug .was::before{content:"Now: ";font-weight:600}
.sug .now::before{content:"Suggested: ";font-weight:600;color:var(--fg)}
.sug .why{font-size:13.5px;margin:0}
.sug-actions{display:flex;gap:8px;flex-wrap:wrap}
.sug-actions button{font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);cursor:pointer}
.sug-actions .acc{background:var(--ok);border-color:var(--ok);color:var(--panel)}
dialog.form{border:1px solid var(--rule);border-radius:8px;padding:0;background:var(--panel);color:var(--fg);width:min(640px,calc(100vw - 32px))}
dialog.form::backdrop{background:rgba(0,0,0,.45)}
dialog.form form{display:grid;gap:12px;padding:18px}
dialog.form h3{margin:0;font-family:var(--f-display);font-size:19px}
dialog.form .orig{font-size:14px;background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;white-space:pre-wrap;max-height:30vh;overflow:auto}
dialog.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
dialog.form textarea,dialog.form input{font:inherit;font-size:14.5px;color:var(--fg);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
dialog.form textarea{min-height:9em;resize:vertical}
dialog.form .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
dialog.form .row button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);cursor:pointer}
dialog.form .row .primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
dialog.form .err{color:var(--flag);font-size:13px;margin-right:auto}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script>
const H = {"body": "New York City Council · Committee on Environmental Protection and Waterfronts", "title": "Oversight: DEP's citizen enforcement programs, with Intros 561-A, 11-A, 48, 562, 869-A and a preconsidered bill", "meta": [["Date", "Tuesday, October 20, 2026"], ["Chair", "James F. Gennaro"], ["Length", "5 h 31 min"], ["Chapters", "97"]], "video": "https://vbfast-vod.viebit.com/dr/Y291bmNpbG4vQk01WWhvN1JmTndhZ2JNWi9OWUNDLTI1MC04LTFfMjYxMDIwLTEyMTI1NS5tcDQ/NYCC-250-8-1_261020-121255.mp4", "yt": "VGIOZDavC7o", "note": "<b>Machine transcript, not an official record.<\/b> The transcript was generated from the Council's video with Whisper and has not been proofread. Speaker names in bold mark where each person's first turn begins and were confirmed by hand. The smaller label on each line, shown when the speaker changes, is a best guess from voice and context, not a confirmed attribution; “(?)” marks a less certain guess and “Speaker unclear” means no guess was made. A line can contain more than one speaker when someone interrupts. Numbers and quotes can still be wrong. Chapter summaries report what each speaker said on the record; they are not fact-checked. Click any timestamp to play the video from that point; before quoting anything, check the video. Spot an error? Use “Suggest edit” on any line, or “Suggest a correction” on a chapter. It opens a short Google Form with the text filled in; no sign-in needed.", "footer": ["Transcript: 3,459 passages, about 45,025 words, from the official MP4 (NYCC-250-8-1_261020-121255). The YouTube copy is the same file, so timestamps match both.", "A few names the speech model consistently misheard (Gennaro, Avilés, Menin, Mamdani, Lacertosa, NYSEC, TANY, OATH) were corrected in the transcript text. Nothing else was edited.", "Summaries were written from the transcript. No speech was paraphrased as a quote; text in quotation marks is the speaker's words as transcribed."], "chapters": [{"start": 55, "title": "Opening: what is on the agenda", "who": "Chair James F. Gennaro", "points": ["Opens an oversight hearing on DEP's citizen enforcement programs together with six bills: Proposed Intro 11-A (Speaker Menin, higher civil penalties for idling), Intro 48 (Council Member Avilés, translating the Citizens Air Complaint portal), a preconsidered bill (Council Member Hudson, idling violations and the Department of Finance fleet program), and three of his own: Proposed Intro 561-A, Proposed Intro 869-A (code of conduct for citizen noise complaints) and Intro 562 (shifting idling liability to lessees).", "Says idling complaints rose from 9,070 in 2019 to 163,090 in 2025, and that stakeholders including DEP had asked the Council to reform the program.", "Says DEP, OATH and the Department of Finance were invited and declined; DEP sent about a page and a half of written testimony.", "Says vehicles contribute about 11% of local PM2.5, and that the Air Code limits idling to 1 minute near schools and parks and 3 minutes elsewhere."]}, {"start": 679, "title": "Statement on Intro 48 (language access)", "who": "Council Member Alexa Avilés", "points": ["Intro 48 would require DEP to translate the Citizens Air Complaint portal into the City's designated citywide languages.", "Says nearly a quarter of New Yorkers have limited English proficiency and that complaints can only be submitted in English.", "Cites $9 million recovered from Amazon this year and thanks the 38 Council Members who signed on."]}, {"start": 895, "title": "Why the hearing is going ahead", "who": "Chair James F. Gennaro", "points": ["Says several parties urged him not to hold the hearing, and that some bills still need work.", "Says people are not satisfied with the amendments made since the 2024 hearing, which is why the bill is back, and that the outcome will be a balance that probably will not work for everybody.", "Says he wants constructive testimony from all sides."]}, {"start": 1087, "title": "DEP's written testimony, read into the record", "who": "Read by Chair Gennaro; testimony of DEP Commissioner Lisa Garcia", "points": ["The Commissioner did not attend \"on the advice of counsel and related litigation\" and gave no comment on Intro 11-A or Intro 561-A.", "DEP reviewed more than 163,000 public submissions in 2025 and issued about 102,000 idling summonses; it receives about 700 idling reports a day, and each is reviewed by an inspector and a supervisor.", "Reports a backlog of about 230,000 videos; 21 new positions were approved and seven inspectors recently started.", "Intro 48: says DEP is already compliant because instructions and translations exist in all designated citywide languages.", "Intro 562: raises concerns, including removing the vehicle owner's incentive to install anti-idling equipment. Intro 869: supports the intent. Preconsidered DOF bill: defers to the Department of Finance."]}, {"start": 1680, "title": "Avilés disputes DEP on translation", "who": "Council Member Alexa Avilés", "points": ["Agrees a translated guidance form exists, but says users must print it and translate each step manually, and that Intro 48 requires a fully integrated translated portal."]}, {"start": 1967, "title": "Testimony: Reinvent Albany", "who": "Alex Camarda, Reinvent Albany", "points": ["Opposes Intro 561-A and Intro 11.", "Lists what he calls loopholes in 561-A: diesel regeneration, buses idling along routes and for 30 minutes, undefined mechanical problems, and auxiliary battery units; says they will make it hard for complainants and DEP to tell an exception from improper idling.", "On Intro 11, says higher fines are unnecessary and that delinquency rates on fines above $1,000 are already 60% or higher.", "After the Chair asks every witness whether 561-A can be fixed, says he does not think it is fixable and that the Council should focus on faster due process and more resources for OATH and DEP."]}, {"start": 2325, "title": "Testimony: health researcher on PM2.5", "who": "George Thurston, NYU School of Medicine (testifying for himself)", "points": ["Says he published the first U.S. paper linking PM2.5 to mortality (1987), research the EPA cited when it set the 1997 standard, and has studied diesel exposure in New York City.", "Supports enforcing the idling rules but is concerned that 561-A's exemptions, such as regeneration, could become loopholes; compares them to power-plant exemptions that he says get invoked often and cannot be verified.", "Calls for more proactive enforcement and incentives for electric heavy-duty trucks."]}, {"start": 2560, "title": "Testimony: 350 NYC", "who": "Margaret Perkins, 350 NYC", "points": ["Says 350 NYC is very much opposed to 561-A, and frames idling as part of the climate crisis.", "Says trucks are 80% of vehicle pollution, and points to Local Law 97 and congestion pricing as examples of the City making change work."]}, {"start": 2699, "title": "Testimony: heating-fuel distributors", "who": "Rocco J. Lacertosa, CEO, New York State Energy Coalition (NYSEC)", "points": ["Supports 561-A's treatment of pumps used in fuel delivery and its exemption for required diesel particulate filter regeneration cycles.", "Supports replacing percentage-based complainant awards with fixed amounts, enforcement timelines, and giving respondents the video evidence.", "Supports Intro 869-A; opposes Intro 11-A for now, saying 561-A's reforms should be implemented and evaluated before penalties rise."]}, {"start": 2867, "title": "Testimony: program participant", "who": "Max Resnick, Brooklyn resident", "points": ["Asks the Council to withdraw 561-A and pass Intro 48; says 561-A is not resurrectable because of its loopholes and exceptions.", "Says he submits 10 to 15 complaints a month and that dump trucks idling near an elementary school playground on Coney Island Avenue turned off when he started filming."]}, {"start": 2988, "title": "Epstein questions the first panel", "who": "Council Member Harvey Epstein with the first panel", "points": ["Asks Lacertosa what environmental benefit the exemptions bring; Lacertosa says he does not know that they help one way or the other, but a delivery cannot be made without the engine running the pump, and his members would use technology that avoids this if it existed.", "Another panelist (not identified on the audio) says the exemptions would undermine the intent of the law; Camarda says complainants and DEP could not tell whether a truck is regenerating, has a working auxiliary unit or has a mechanical problem, making the program inoperable.", "Asked how to improve video quality, Resnick says experienced complainants already coach newcomers and that sharing best practices publicly would help."]}, {"start": 3340, "title": "Avilés questions Thurston on exposure disparities", "who": "Council Member Alexa Avilés and George Thurston", "points": ["Thurston says his studies find much higher diesel exposure in the South Bronx, which is surrounded by highways, and similar conditions in Harlem.", "Suggests the City use its buying power on cleaner trucks to create a market for them.", "Avilés says the portal still requires complaint questions to be answered in English."]}, {"start": 3621, "title": "Second panel called: construction and trucking industry", "who": "Chair James F. Gennaro", "points": ["Calls what he describes as an industry panel: Elizabeth Crowley and Felice Farber (Building Trades Employers' Association / Subcontractors Trade Association), a representative of the Interior Demolition Contractors Association, Joseph Ferrara (Aggregate and Cement Trucking) and Melissa Barbour (Mechanical Contractors Association of New York)."]}, {"start": 3788, "title": "Testimony: cement delivery company", "who": "Joseph Ferrara, Aggregate and Cement Trucking", "points": ["Says his 18 drivers are being inundated with idling violations, mostly from citizen complaints that he calls \"a money grab\", and that respondents cannot cross-examine complainants.", "Proposes requiring a complainant to first tell the driver to stop idling, and to file only if the driver refuses.", "The Chair responds that he is trying to make the program fair and would not be holding the hearing if he were not seeking changes."]}, {"start": 4086, "title": "Testimony: interior demolition contractors", "who": "David Atkin, Interior Demolition Contractors Association (attorney)", "points": ["Says members use certified clean-idle trucks, as required by the Business Integrity Commission.", "Says trucks waiting for debris containers to come down building elevators cannot shut down between loads, because restarting takes time to regenerate and reach full power.", "Asks for an exemption for certified clean-idle trucks working at commercial buildings, modeled on California's, that would not apply near facilities such as schools."]}, {"start": 4302, "title": "Testimony: Subcontractors Trade Association", "who": "Felice Farber, Executive Director, Subcontractors Trade Association", "points": ["Says running engines on job sites often power pumps, liftgates or decontamination units, finish a required emissions control cycle, or keep drivers safe in extreme heat or cold, and that members are ticketed in these situations even with a valid exemption sticker.", "Says notices arrive many months later and hearings a year later, when no one can reconstruct a stop.", "Supports Intro 561 with further amendments; asks the committee to hold Intro 11-A, which she says escalates fines across a whole company."]}, {"start": 4440, "title": "Testimony: Mechanical Contractors Association", "who": "Melissa Barbour, Mechanical Contractors Association of New York", "points": ["Says engines run for reasons such as powering a boom or liftgate, no-heat calls in extreme weather, or waiting to enter a job site.", "Says violations arrive 6 to 12 months later and hearings can take 15 months or more; says DEP's commissioner has stated complaints are concentrated in core Manhattan, wealthier parts of Brooklyn and western Queens.", "Supports Intros 561-A, 562 and 869-A with amendments; asks that 11-A be held, saying it would raise fines to as much as $3,000 and escalate them across a fleet."]}, {"start": 4572, "title": "Chair's questions: when are diesel particulate filters required?", "who": "Chair Gennaro with the industry panel", "points": ["A panelist whose fleet is regulated by the Business Integrity Commission says the whole fleet must have them because BIC requires certified clean-idle trucks; when regeneration is needed a light comes on and the driver stops where he can.", "The same panelist cites an OATH decision in which a Salvation Army truck was ticketed while regenerating, and says a truck that does not regenerate could be destroyed.", "Ferrara says DEP and most public-agency contracts require the equipment, and that regeneration superheats the exhaust to burn off soot, with the need arising when the truck idles at a job site."]}, {"start": 4802, "title": "Can an observer tell a truck is regenerating?", "who": "Chair Gennaro with the industry panel", "points": ["The Chair asks how an observer could tell whether a vehicle is in a regeneration cycle. A panelist says a monitor inside the cab shows it.", "A panelist says that with timely notice a company could document that a truck was regenerating, but notices arrive too late, and that OATH disregarded one member's evidence that a vehicle was not running."]}, {"start": 4962, "title": "Epstein questions the industry panel", "who": "Council Member Harvey Epstein with the industry panel", "points": ["Challenges the idea that complainants should knock on a truck's window first, saying he has been cursed at for asking drivers to stop idling next to a school playground; a panelist answers that a civil conversation is the solution.", "A panelist says a truck must pull over within a short time when the regeneration light comes on and that regeneration takes about 15 to 20 minutes.", "Epstein says his Manhattan district has heavy truck traffic and pollution near the FDR Drive, and that more exceptions would not reduce idling; a panelist says, referring to her written testimony, that fines should be based on where air pollution is worst."]}, {"start": 5303, "title": "Third panel called", "who": "Chair James F. Gennaro", "points": ["Calls Eric Goldstein (NRDC), Suhali Mendez (New York Lawyers for the Public Interest), Ryan Scott Lokey, Evan Kalish and Jonathan Goren."]}, {"start": 5436, "title": "Testimony: NRDC", "who": "Eric Goldstein, Natural Resources Defense Council", "points": ["Calls the Air Code's citizen complaint provision one of the most innovative environmental laws the Council has passed; says NRDC filed one of the earliest citizen complaint actions more than 30 years ago.", "Supports Intros 11-A, 48, 562 and 869-A.", "Names three problems: the volume of complaints burdens DEP staff; filings have not sufficiently targeted environmental justice communities; and many violators treat fines as a cost of doing business.", "Strongly supports 561-A's concept of an incentive to install less-polluting equipment, but says NRDC does not support 561-A in its current form."]}, {"start": 5597, "title": "Testimony: New York Lawyers for the Public Interest", "who": "Suhali Mendez, policy and legislative coordinator, New York Lawyers for the Public Interest", "points": ["Asks the Council to pass Intro 11 and Intro 48 and to reject the current version of 561-A, saying its broad exemptions would undermine enforcement.", "Cites NYLPI's research on school bus pollution and says idling is a public health and environmental justice issue."]}, {"start": 5740, "title": "Chair invites NRDC and NYLPI to propose bill language", "who": "Chair James F. Gennaro", "points": ["Asks both organizations how they would write the bill and says something has to happen with 561 because the status quo is not working in an optimum way."]}, {"start": 5848, "title": "Testimony: former driver and frequent complainant", "who": "Ryan Scott Lokey, environmental consultant (testifying for himself)", "points": ["Says he drove delivery vehicles for more than 17 years, now advises small businesses on compliance, and has filed over 5,000 complaints.", "Opposes Intros 11-A, 561-A, 562 and 869-A; supports Intro 48 and the preconsidered bill (T2026-2662).", "Calls the regeneration exemption the most problematic provision: says that even with his experience he can tell from outside a vehicle whether it is regenerating with only about 70% accuracy, and asks how an OATH hearing officer could.", "Disputes the prior panel, saying vehicles can regenerate actively or passively while driving and in most cases do not need to pull over."]}, {"start": 6027, "title": "Testimony: Eastern Queens parent and complainant", "who": "Evan Kalish, Eastern Queens resident and parent", "points": ["Says the program has made a difference where he lives: Con Edison vehicles that used to idle constantly are now turned off.", "Says he once prosecuted ice cream truck noise complaints and received an anonymous death threat, and objects to proposals that complainants confront drivers.", "Says 561-A's timelines would push DEP's work onto complainants, and calls the bill \"irreconcilable\"."]}, {"start": 6330, "title": "Testimony: what current law already exempts", "who": "Jonathan Goren (testifying for himself)", "points": ["Responding to industry claims of being ticketed while pumping or using a crane, reads Admin Code § 24-163, which exempts an engine used to operate a loading, unloading or processing device.", "Reads the DEP rule (Title 15, § 39-01, as he cites it) defining a processing device to include operating a lift, crane, pump, drill, hoist or mixer."]}, {"start": 6481, "title": "Epstein questions the third panel on notice and regeneration", "who": "Council Member Harvey Epstein with Goldstein and Lokey", "points": ["Goldstein says faster notice to respondents is one element that should be fixed; the panel agrees on the record that businesses should be notified sooner.", "Lokey distinguishes active regeneration (manually triggered while parked, which he says older trucks require) from passive regeneration while driving, which he says most vehicles since about 2009 can do.", "Says active regeneration is almost 30 times dirtier than passive and that DPF manuals warn against doing it in populated areas.", "Says a regeneration exemption would create an essentially unrebuttable defense that benefits large diesel fleets most, naming Baldor and Academy Bus; says small fleets often run gasoline engines.", "Lokey tells the Chair he does not believe 561-A can be saved as written."]}, {"start": 6844, "title": "Fourth panel called; short pause", "who": "Chair James F. Gennaro", "points": ["Calls Zach Miller (Trucking Association of New York), Larry Zogby (RDS Delivery Service), Pat Highland (Metro Truck Association), and Elizabeth Crowley (Building Trades Employers' Association) with a colleague.", "The audio is silent from about 1:55 to 2:00 while the panel assembles."]}, {"start": 7312, "title": "Testimony: Building Trades Employers' Association", "who": "Elizabeth Crowley, President and CEO, BTEA, with Samuel Eluto", "points": ["Says BTEA covers more than 24 associations and over 1,200 union contractors; supports the core reforms in 561-A, Intro 562 and Proposed Intro 869-A, but cannot support 11-A as drafted.", "Says engines often run to power liftgates, lighting, cranes, pumps, compressors, generators, work-zone warning lights and OSHA-required decontamination showers.", "Says 561-A's processing-device definition covers only equipment mechanically connected to the engine, and asks the Council to define \"operational idling\" to include traffic control devices, generators and decontamination units.", "Notes 561-A lets school buses idle up to 30 minutes below 40°F or at 80°F and above, and asks for a comparable exception for workers waiting to enter job sites.", "Calls the current process unfair, says it encourages \"community vigilantes\", and says the City bounty has made enforcement a business for a few high-volume complainants.", "Her colleague asks for stronger definitions of operational idling and evidence requirements at OATH."]}, {"start": 7741, "title": "Testimony: Trucking Association of New York", "who": "Zach Miller, Trucking Association of New York (TANY)", "points": ["Says TANY did not oppose the program when it was enacted but that it has become \"a profitable cottage industry for individuals\", with stacked citations, delayed notice and barriers to challenging evidence.", "Strongly supports 561-A, including recognition of refrigerated units and loading devices and the exemption for required DPF regeneration; says the vehicle's ECM can generate a report showing whether it was regenerating.", "Supports Intros 562 and 869-A; opposes 11-A's penalty increase at this time."]}, {"start": 7837, "title": "Testimony: medical delivery company", "who": "Larry Zogby, CEO, RDS Delivery Service", "points": ["Says 30 selected idling summonses from 2020 to 2025 cost over $32,000, and hearings were scheduled 500, 700 and 962 days after the violation.", "Asks for notices mailed within 30 to 45 days, hearings within 90 days, no repeat-offense increases before a first notice, and a defined 60-minute Zoom hearing window.", "Opposes Intro 11; supports Intros 561, 562 and 869."]}, {"start": 7957, "title": "Chair and Epstein question the trucking panel on delays and notice", "who": "Chair Gennaro and Council Member Epstein with Zogby and Miller", "points": ["Zogby says that by the time notices arrive, drivers may have left, so the company cannot correct their behavior.", "Miller says companies do not keep records for two years, so they lose evidence of legitimate idling, and points to the red-light camera program, where respondents get prompt notice and video.", "Epstein says the panel agrees OATH is not notifying respondents or hearing cases quickly enough, and agrees to observe a member's OATH hearing.", "A panelist says multiple violations on the same vehicle pile up before the company learns of the first one."]}, {"start": 8446, "title": "Trucking panel: unreceived summonses and lessee liability", "who": "Trucking panel with Council Member Epstein", "points": ["A panelist says respondents sometimes never receive a summons, are found in default at OATH, and then become repeat offenders.", "Epstein says there is shared ground on faster notice, driver education and avoiding repeat fines for improper violations.", "A panelist says Intro 562 matters because rental and leasing companies do not keep records of who was operating a vehicle years earlier.", "Zogby says staff can wait three quarters of a day at a hearing, and asks for a defined 60-minute Zoom window."]}, {"start": 8623, "title": "Fifth panel called", "who": "Chair James F. Gennaro", "points": ["Calls Hayden Brockett, Rafil Kroll-Zaidi, Alicia Raymond and Kevin McGee."]}, {"start": 8706, "title": "Testimony: opposing 561-A and 11-A", "who": "Hayden Brockett (testifying for himself)", "points": ["Says he joins over 30 environmental and good-government groups and two committees of Manhattan Community Board 7 in opposing 561-A.", "The Chair interjects that the bills are works in progress and the Council is not trying to pass them tomorrow.", "Says Intro 48 would open the program to 2.5 million New Yorkers who don't speak English, but that 561-A would legalize all diesel idling and all school bus idling for half the year, require DEP to discard pending complaints it cannot review in time, and cut citizen awards.", "On 11-A, says nearly 40% of idling violators ignore tickets that now run $350 to $600, and that a $3,000 fine would reduce compliance rather than improve it."]}, {"start": 8935, "title": "Testimony: participant supporting language access", "who": "Alicia Raymond (participant in the program)", "points": ["Supports Intro 48, saying it would help people like her mother, whose first language is not English.", "Says 561-A's 60-day requirement would force DEP to discard violations when processing currently takes about 12 months.", "Says the regeneration exemption would be \"a get out of jail free card\" because neither she nor a DEP reviewer could confirm it.", "Says both her parents were long-haul truck drivers; asks the Council to reject 561-A and staff DEP better."]}, {"start": 9081, "title": "Chair: questions DEP should have answered", "who": "Chair James F. Gennaro", "points": ["Says it would have been nice to have DEP present, because the Council had questions along the lines of the first two witnesses' testimony."]}, {"start": 9141, "title": "Testimony: comparison to camera enforcement", "who": "Rafil Kroll-Zaidi", "points": ["Compares citizen idling enforcement to red-light and speed cameras and says the Council would not legalize ghost plates in response to pushback.", "Says DEP could already send respondents \"heads-up\" letters with video access as complaints arrive, prioritize equipment-leasing companies for review, and adjust the fine schedule without legislation.", "Says 561, 562 and 869 would be destructive, that 11-A would act as cover, and that only Intro 48 would improve the program; says he has trained participants in the South Bronx."]}, {"start": 9394, "title": "Testimony: walker and participant", "who": "Kevin McGee (participant in the program)", "points": ["Says he walks 12 miles a day and files complaints in his spare time.", "Says participants have watched major fleets, including Con Edison, Amazon and Verizon, change their behavior.", "Cites 2,400 deaths a year from air pollution in New York City, urges the Council to reject 561-A in its entirety, and supports Intro 48."]}, {"start": 9601, "title": "Sixth panel called: bus and business groups", "who": "Chair James F. Gennaro", "points": ["Calls Patrick Condren (Bus for NYC Coalition), Glen Avery (Bus Association of New York State), Henry Smith (Long Island City Partnership), Nicholas Day and Ernest Welde."]}, {"start": 9755, "title": "Testimony: comparing air pollution deaths to other causes", "who": "Ernest Welde", "points": ["Opposes Intros 11, 561, 562 and 869 and supports 48; says 561-A is unrecoverable.", "Compares about 2,400 air-pollution deaths a year, which he attributes to Department of Health figures, with about 250 traffic deaths and 400 gun homicides a year.", "Says 561-A would violate Article I, § 19 of the New York State Constitution (the right to clean air and water), and that no analysis has been done of its effect on air quality.", "Objects to 30 minutes of idling in front of schools, unlimited diesel idling for regeneration, and lowering the citizen share."]}, {"start": 9938, "title": "Testimony: vehicle rental company", "who": "Nicholas Day, co-CEO, Edge Auto Rental", "points": ["Says Edge received more than 175 idling summonses totaling over $80,000 this year, recovered about $20,000 from customers and absorbed about $60,000.", "Says the company's customers, not its employees, idled the vehicles, and summonses arrive six months to over a year later.", "Asks the Council to pass Intro 562, adopt 561-A's procedural protections, and not raise penalties under 11-A until these problems are fixed."]}, {"start": 10091, "title": "Testimony: Bus Association of New York State", "who": "Glen Avery, President, Bus Association of New York State", "points": ["Opposes including motor coaches in the citizen complaint program, saying public transit buses use the same equipment but are not subject to it, and calls the result \"revenue generation\".", "Says a coach's main engine also powers safety, HVAC and electrical systems, making the 3-minute rule difficult to meet.", "Opposes Intro 11-A, saying fines already lead coach operators to avoid New York City.", "Asks that 561-A's exemption for systems controlling \"temperature sensitive cargo\" also cover passengers on hot or cold buses."]}, {"start": 10249, "title": "Testimony: Bus for NYC Coalition", "who": "Patrick W. Condren, Bus for NYC Coalition", "points": ["Says a bus is the most environmentally efficient passenger vehicle on New York streets.", "Says private buses should be administratively exempt from the fines, as public buses are and as private buses are from congestion pricing.", "Says the 3-minute rule is untenable, citing what he calls a 15-minute federal guideline for buses."]}, {"start": 10601, "title": "Seventh panel called", "who": "Chair James F. Gennaro", "points": ["Calls a panel of individual witnesses, Dietmar Detering, George Packenham, Michael McFadden, Timothy David and Ileane Spinner. The Chair says he will enforce the two-minute limit more strictly."]}, {"start": 10715, "title": "Testimony: Hell's Kitchen resident", "who": "Timothy David", "points": ["Says he has longtime asthma and opposes 561-A because it would weaken one of the City's most successful air quality enforcement programs."]}, {"start": 10884, "title": "Testimony: participant with asthma", "who": "Ileane Spinner", "points": ["Supports the program and opposes 561-A, saying the anti-idling laws have only been enforced in the past seven years because citizens stepped up.", "Says at least 25 environmental and civic groups oppose the bill, which she calls a corporate giveaway to polluters.", "Says the Mayor could fix language access and raise fines without Intros 48 or 11, that 561-A has zero co-sponsors, and that the amendments made it worse; says it would give $100 million to polluting corporations."]}, {"start": 11062, "title": "Testimony: documentary filmmaker", "who": "George Packenham, New York Clean Air Collective", "points": ["Says he has fought needless idling for 20 years and produced a documentary on it.", "Opposes 561-A, saying the trucking and bus companies are after higher profits and less oversight, and points Council Members to the Environmental Defense Fund study \"Idling Gets You Nowhere\"."]}, {"start": 11209, "title": "Testimony: Queens complainant", "who": "Dietmar Detering, Queens resident", "points": ["Says many fleets have changed their behavior and enforcement now reaches those that have not; says 561-A, 562 and 869-A would give polluters relief.", "Opposes 11-A, saying aggressive penalties encourage confrontation and nonpayment, and prefers a reasonable inflation adjustment.", "Supports Intro 48 but says access also needs timely feedback, noting DEP took over a year to tell complainants their submissions were defective; asks that DEP be resourced to process complaints within the existing 45-day period."]}, {"start": 11365, "title": "Chair: \"what we have right now is not working\"", "who": "Chair James F. Gennaro", "points": ["Says he is learning a lot about what DEP could do to clear its backlog, that this is one of the hardest challenges in his years chairing the committee, and that the current system is not working the way it could."]}, {"start": 11551, "title": "Testimony: correcting claims about exemptions", "who": "Mike Streeter, New York Clean Air Collective (testifying for himself)", "points": ["Supports Intro 48; calls 561-A unfixable and 11-A unnecessary.", "Says fuel-pump vehicles are already exempt while operating pumps, and that DEP rejects complaints for vacuum, fuel or oil trucks if engine-powered work may be taking place.", "Says compacting trucks avoid tickets by waiting until they have enough bins to compact continuously, and that DEP exemption stickers only reflect exemptions a truck already has under the law.", "Says Aggregate and Cement trucks idled for hours near Thomas Greene Playground in Brooklyn last year before shutting off once complaints began."]}, {"start": 11704, "title": "Testimony: participant from Brooklyn", "who": "Justin Bernstein", "points": ["Says that while homeless in Lower Manhattan he saw coach buses idling constantly on Canal Street, and that the program changed drivers' habits.", "Opposes 561, saying existing exemptions are already abused, for example by cycling liftgates to reset the three-minute clock."]}, {"start": 11848, "title": "Testimony: participant from Coney Island", "who": "Vlad Kucharavi", "points": ["Opposes 561-A as a pass for negligent companies and supports Intro 48, saying people whose English is limited are often the most exposed to environmental hazards."]}, {"start": 11998, "title": "Testimony: Queens native", "who": "Sarah O'Brien", "points": ["Says 20% of lung cancer patients in the city have never smoked, and that the program has generated over 350,000 complaints and over $145 million in fines.", "Says her mother, whose first language is Arabic, cannot participate because the portal is English-only, and disputes DEP's claim that translated instructions are enough."]}, {"start": 12126, "title": "Chair: the program works in some aspects, not others", "who": "Chair James F. Gennaro", "points": ["Says the program is working but not in some aspects, and that the current iteration is not where the Council wants to land."]}, {"start": 12195, "title": "Next panel called", "who": "Chair James F. Gennaro", "points": ["Calls Luis Palatano, Dylan Stack, Wanfang Wu, Gregory Gonzalez and Oren Galchen."]}, {"start": 12288, "title": "Testimony: New York Clean Air Collective", "who": "Dylan Stack, Vice President, New York Clean Air Collective", "points": ["Says 25 civic groups oppose 561-A and that it is unsalvageable; calls it a corporate giveaway, citing the $9 million Amazon paid this year.", "Says the regeneration and processing-device provisions would erase millions in fines, and that trucks can regenerate while driving.", "In an exchange, the Chair says it is up to complainants to bring more complaints in environmental justice communities, calling the current pattern \"like a Manhattan and like Brooklyn thing\".", "The Chair says the hearing is what reconsideration looks like, and that after the last amendments he thought the Council could do better."]}, {"start": 12532, "title": "Testimony: complainant earnings and the program's value", "who": "Oren Galchen", "points": ["Calls 561-A unsalvageable and \"a poison pill\" for Intro 11, saying higher fines would be unenforceable if 561-A passes.", "Responds to concerns that complainants make too much money: compares the program to tax-evasion whistleblower rewards and traffic cameras, notes that about 40% of tickets go unpaid, and says the City keeps 75% of what is collected."]}, {"start": 12676, "title": "Testimony: self-prosecution as a pressure valve", "who": "Wanfang Wu", "points": ["Opposes all the bills except Intro 48; says Intro 11's fines would hurt small businesses and that 561 is not salvageable.", "Says the backlog is starting to taper as more complainants prosecute their own complaints after DEP takes no action for 45 days.", "Says 561-A would end this by adding a $25 cost to self-prosecution and a 30-day deadline, when DEP can take up to two months to release a case.", "Says Intro 562's transfer of liability would let large companies pass tickets to last-mile contractors that can close and reopen under new names.", "The Chair asks his legislative director to meet with Wu after the panel to get more detail."]}, {"start": 12870, "title": "Testimony: former heavy-equipment operator", "who": "Gregory Gonzalez", "points": ["Says he has driven diesel trucks and laid asphalt, and that stopping idling also protects the workers who operate the vehicles.", "Says armored-truck companies, including Ferrari Express, Loomis and Malca-Amit, idled for hours in the Diamond District and began switching to electric vehicles after receiving complaints."]}, {"start": 13006, "title": "Testimony: Southeast Queens complainant", "who": "Luis Palatano", "points": ["Says he has filed nearly 4,000 complaints since April 2022, mostly in Jamaica and Southeast Queens environmental justice neighborhoods.", "Opposes 561-A's regeneration exemption, suggesting an exterior regeneration indicator if one is kept, and its 60-day expiration, which he says would erase tens of thousands of complaints unless DEP and OATH hire more staff.", "Says forcing citizens to act as prosecutors would create barriers in low-income neighborhoods."]}, {"start": 13178, "title": "Next panel called; short break", "who": "Chair James F. Gennaro", "points": ["Calls Irena Goman, Larry G. Lee, Grant, Peter O'Hara and Duc, then takes a short break."]}, {"start": 13482, "title": "Testimony: \"diesel fumes are the tobacco of New York City streets\"", "who": "Larry G. Lee (testifying on his own behalf)", "points": ["Says the regeneration exemption would give every diesel truck and bus an unverifiable excuse, and that the 60-day clock would let nearly every complaint expire unresolved.", "Addresses the Chair directly, citing his Tobacco 21 law as an example of standing up to a powerful industry, and asks him to withdraw the bill.", "The Chair recounts passing Tobacco 21 over the opposition of the American Lung Association and the American Cancer Society."]}, {"start": 13893, "title": "Testimony: uptown parent", "who": "Irena Goman", "points": ["Says she and her family have noticed fewer idling trucks and buses in upper Manhattan.", "Objects to 561-A barring DEP from issuing violations more than 60 days after a complaint, and to giving complainants only 14 days to file.", "Supports Intro 48, saying English is not her first language and many foreign-born New Yorkers are not comfortable in it."]}, {"start": 14127, "title": "Testimony: the 60-day deadline and the processing-device definition", "who": "Grant (complainant)", "points": ["Says DEP is already close to a year behind, so the 60-day provision could be read to discard a year or more of complaints, and asks how DEP gets from the backlog to a steady state.", "Warns that broadening the processing-device definition to electrical equipment needed for work could cover almost anything, such as a driver charging a phone."]}, {"start": 14341, "title": "Chair: the 60-day provision is not meant to discard complaints", "who": "Chair James F. Gennaro", "points": ["After consulting committee counsel, says many witnesses have read the 60-day section to mean violations are thrown out once the window passes, but that is not its intent.", "Says the section will be made clearer so that is not the result, and that \"a lot of things are going to get changed\"."]}, {"start": 14435, "title": "Testimony: newer New Yorker", "who": "Duc", "points": ["Opposes 561-A's regeneration exemption, the 60-day window and reduced complainant incentives.", "Says Intro 11 would raise idling penalties to as much as $7,500, which could devastate small businesses and independent contractors."]}, {"start": 14657, "title": "Testimony: former substitute teacher", "who": "Tingting Wong, Bed-Stuy resident", "points": ["Says the Council restricted idling near schools to one minute more than 15 years ago, citing school buses, and that 561-A would effectively exempt school buses in many circumstances on heating and cooling grounds.", "Says DEP's evidence standards are stricter in practice than the law and that rejections led her to stop participating; asks for faster summonses or warning notices with video links."]}, {"start": 14821, "title": "Testimony: parent of a child with asthma", "who": "Robin Warren", "points": ["Says her family found the program while managing her young daughter's acute asthma.", "Says commercial fleets are 6% of traffic but produce over half of dangerous tailpipe pollution, and that 561-A's 60-day deadline could lead the City to dismiss 170,000 pending violations."]}, {"start": 14970, "title": "Testimony: walking to work past idling trucks", "who": "Adam Thomas", "points": ["Says he sees the same diesel trucks idling outside schools, museums and parks every day; drivers he asks to turn off often restart once he walks on.", "Says the program should be amplified rather than restricted; the Chair mentions SUVs idling in the City Hall parking lot."]}, {"start": 15160, "title": "Testimony: notifying respondents with existing data", "who": "Peder Wessel", "points": ["Agrees with industry witnesses that respondents need much faster notification, and says DEP already has everything needed to send automatic e-mail, text or mailed notices with video when a complaint arrives.", "The Chair says the process needs more technology and that the Mayor, not the Council, sets DEP's staffing level."]}, {"start": 15426, "title": "Testimony: former delivery driver", "who": "Josh Bisker", "points": ["Says 561-A would create loopholes, hamper agencies, discourage participation and possibly void outstanding complaints retroactively.", "Describes the program as pairing penalties that deter polluters with rewards that bring in complaints, and says 561-A undermines both and public trust.", "Says only Intro 48 on the docket would improve the program."]}, {"start": 15586, "title": "Testimony: physician on health effects of idling", "who": "Dr. Seth Eisenberg", "points": ["Says he has practiced for over 30 years, including at Department of Health clinics, and lists respiratory, cardiovascular, neurological, metabolic and reproductive harms he attributes to idling exhaust.", "Says Amazon has been the third-worst idling violator, with over 12,000 tickets, but that none of the violations he has recorded in six months involved an Amazon vehicle."]}, {"start": 15733, "title": "Testimony: \"the status quo is working\"; exchange on DEP staffing", "who": "Eric Eisenberg, attorney and New York Clean Air Collective board member", "points": ["Says 561-A cannot be fixed with statements of intent because its literal language is the problem, and that DEP just needs more resources, which the program's net revenue could fund.", "The Chair replies that the Mayor sets DEP's staffing and the Council can only negotiate in the budget process.", "Says complaint locations correlate closely with where pollution is worst and that the group will submit maps; says DEP does not issue repeat violations until prior ones are adjudicated and that defaults can be reopened.", "Says generators do not use engine power, that using the engine for liftgates and refrigeration is already a defense, and that certified clean-idle engines are not clean.", "Asks the Chair to commit to a further public hearing on any amendments; the Chair says he takes testimony and does not answer questions."]}, {"start": 15972, "title": "Testimony: parent of a child with asthma", "who": "Jonathan Robidoux", "points": ["Says his oldest daughter needs an albuterol inhaler daily, and that an estimated 60,000 public school children have active asthma.", "Calls 561-A unsalvageable and says it discourages participation just as Intro 48 would expand it.", "Says that if he reports the same truck three times today, DEP would later issue all three as first offenses; the Chair calls this a fair point."]}, {"start": 16198, "title": "Testimony: Bronx high school teacher", "who": "Aaron Jacobs", "points": ["Says many of his ninth-graders near Fordham have asthma and that exhaust reaches his second-floor classroom.", "Says 561-A legalizes regeneration idling that DEP and OATH have ruled illegal and unnecessary, and replaces the 25% award with a flat fee.", "The Chair closes the in-person panels, saying \"I'm a different guy from when I started this hearing\"."]}, {"start": 16353, "title": "Remote testimony begins: NY League of Conservation Voters", "who": "Alia Soomro, New York League of Conservation Voters", "points": ["Recommends a more accessible portal, more DEP and OATH staffing, and stronger enforcement and collections, along with loading zones, cargo bikes, marine freight and school bus electrification.", "Supports Intros 48 and 11-A; says 561-A is not in the right place, including allowing school buses to idle up to 30 minutes."]}, {"start": 16618, "title": "Testimony: ice cream truck air quality measurements", "who": "Nandini Kanesia, engineering student", "points": ["Reports portable-sensor VOC readings at a child's breathing height beside ice cream trucks, with peaks 24% to 183% above typical readings.", "Says higher penalties alone could cost a vendor $5,000 to $12,000 over three violations, and that 561-A's processing-device language may mean many ice cream trucks are never cited.", "Asks the committee to ask DEP how many complaints involve ice cream trucks, and to amend Intro 635 to fund a 25-truck pilot."]}, {"start": 16763, "title": "Testimony: support for Intros 11 and 48", "who": "Hunter Severini", "points": ["Supports Intros 11 and 48; strongly opposes 561, 562 and 869.", "Says Intro 562 would shift liability from rental companies that pay to customers who may not, and that 869 raises free-speech concerns.", "Says document metadata indicates 561-A was authored by a DEP lawyer, and calls the agency's apparent involvement in drafting it a matter for scrutiny."]}, {"start": 16907, "title": "Remote testimony: charter coach operator", "who": "Douglas Anderson, Anderson Coach and Travel; past chairman, American Bus Association", "points": ["Opposes Intro 11 and supports 561; says federal safety rules often require idling for air brakes, accessibility lifts and passenger climate control.", "Says notification can take up to two years, and suggests directing part of the fine money to DEP staffing.", "Asks the committee to hold Intro 11 until the process is fixed, treat public and private fleets equally, write federal safety exemptions into the code and designate coach layover spaces."]}, {"start": 17075, "title": "Remote testimony: DEP as the bottleneck", "who": "Michael McFadden", "points": ["Strongly opposes 561-A and says no one receives a violation when the engine is on for a necessary purpose.", "Calls transfer of liability a non-issue, comparing idling summonses to camera violations issued by plate, and says DEP is the real bottleneck."]}, {"start": 17256, "title": "Remote testimony: Conservation Law Foundation on regeneration", "who": "Sarah Craig, senior attorney, Conservation Law Foundation", "points": ["Says CLF has brought Clean Air Act idling cases against bus companies serving New England and New York, including Academy Express.", "Says the federal court in Massachusetts found Academy liable earlier this year for a pattern of violating the state anti-idling law and the Clean Air Act.", "Says the court found stationary regeneration especially polluting, that evidence showed regeneration can be done while driving, and that stationary regeneration outside maintenance yards and at stops along routes is neither necessary nor acceptable.", "Says 561-A would effectively create a regeneration exemption that encourages this on City streets."]}, {"start": 17443, "title": "Remote testimony: limousine and motor coach operators", "who": "Jason Chernow, NLA and a New Jersey transportation association (names as heard)", "points": ["Opposes Intro 11; asks that motor coach and limousine associations help develop enforcement policy.", "Says drivers must balance passenger safety, idling rules and required regeneration cycles, and that violations are issued without understanding why a vehicle had to idle."]}, {"start": 17628, "title": "Remote testimony: bus operator and trainer", "who": "Anthony Griffith, transportation consultant", "points": ["Says he has driven buses for over 40 years and trained over 5,000 operators; says vehicles must build air pressure and will not move with low air.", "Offers to bring a vehicle to educate Council Members, DEP and OATH staff on what operating one requires."]}, {"start": 17786, "title": "Remote testimony: truck leasing", "who": "Christopher Eke, trucking industry", "points": ["Supports 561-A and 562; opposes 11-A until the program is fixed. Says his company has about 2,000 trucks, nearly all leased to others.", "Says DEP sends complaints to the owner rather than the lessee, forcing the company to track down customers.", "On regeneration: \"leave it out of the bill. It doesn't affect us either way. It's not going to be a defense we're going to use. We're looking for due process.\""]}, {"start": 18042, "title": "Remote testimony: Fullington Bus", "who": "Patrick Kane, senior safety director, Fullington Bus Company", "points": ["Opposes 11-A; says securing a wheelchair with an ADA lift takes 10 to 15 minutes with the engine running, and that HVAC and defrosters need the engine.", "Says $6,000 in idling fines and 12- to 18-month processing times could make routes unviable."]}, {"start": 18179, "title": "Remote testimony: Brooklyn private investigator", "who": "Anne Diebel", "points": ["Opposes 561-A; says dump trucks that once lined up for days near P.S. 307 now shut off, with drivers using site flaggers and WhatsApp groups to call trucks forward.", "Says the biggest problem is processing time, and that other cities and NYC agencies such as Landmarks Preservation and HPD send respondents rapid warnings."]}, {"start": 18337, "title": "Remote testimony: Midtown East resident", "who": "Thomas Bailey", "points": ["Says complainants must already show DEP that a liftgate is not in use or a refrigeration unit is independently powered.", "Suggests more DEP technology and staff, and street signs saying idling is illegal."]}, {"start": 18444, "title": "Remote testimony: \"terminal point\" would mean every bus stop", "who": "Andrew Lynch, Executive Vice President, Hampton Jitney", "points": ["Says 561-A defines \"terminal point\" as planned stops including the beginning or end of a route, which would make every scheduled bus stop a terminal point where idling is prohibited outright above 40°F.", "Says the existing law's \"whether or not enclosed\" language shows a terminal point meant a structure such as a terminal, depot or layover.", "Notes 561-A gives school buses 30 minutes for heating and cooling but nothing to a private coach carrying the same children.", "The Chair says he was not aware of this issue."]}, {"start": 18602, "title": "Remote testimony: Panorama Tours", "who": "Michelle Peteliki, President, Panorama Tours", "points": ["Describes cases from her company: a coach driven around empty to cool it, a regeneration cut short that disabled a bus, and a $1,000 summons arriving 10 months later after camera footage was overwritten.", "Asks that private motor coaches be excluded from 11-A and the citizen enforcement program, or at minimum get timely enforcement and safeguards against abuse."]}, {"start": 18762, "title": "Remote testimony: Teamsters Local 817", "who": "Jim Whalen, Teamsters Local 817 (film and TV transportation)", "points": ["Says production trucks are a \"mobile factory\" that powers film sets; summonses arrive six to nine months later.", "Describes \"bounty hunter tactics\" such as filming while hiding that a liftgate is in use, and says employers have tried to shift fines onto members."]}, {"start": 18935, "title": "Remote testimony: waste and recycling haulers", "who": "Lou Dubouque, National Waste and Recycling Association, NYC chapter", "points": ["Says members are ticketed while collecting garbage because the compactor blade isn't moving, during DPF regeneration, and while waiting for a car and cyclist to pass.", "Welcomes 561-A's treatment of regeneration but asks for explicit protection throughout active collection and for safety stops."]}, {"start": 19086, "title": "Remote testimony: pediatrician's six steps", "who": "Dr. Patrick Schnell, pediatrician", "points": ["Lists steps to stop idling: raise fines (says adjusting $350 for inflation gives about $550), get serious about enforcement, stop discounting outstanding fines for the worst polluters, speed up summonses, educate hearing officers, and simplify the program.", "When he says 561-A would discard violations not processed in 60 days, the Chair interjects: \"No, that's not true. We've been through that.\""]}, {"start": 19244, "title": "Remote testimony: CHEKPEDS", "who": "Christine Berthet, co-founder, CHEKPEDS", "points": ["Strongly opposes 561-A and Intro 11; says her neighborhood has the third-worst air quality in the city, with hundreds of buses and construction trucks.", "Says that before the citizen program no agency helped, and that idling there is now largely a thing of the past; says summonses and rewards will decline as the program succeeds."]}, {"start": 19380, "title": "Final remote witnesses", "who": "Rachel Optinaker, David Sucher and Chatterjee", "points": ["Optinaker, a singer, opposes 561 and supports 48, saying idling in her neighborhood has dropped significantly.", "Sucher supports Intro 11 and opposes 561; suggests rental contracts pass idling fines to renters, as with red-light fines, and that some fine revenue go back to DEP for staffing.", "Chatterjee says companies including Action Environmental and Academy have been idling less, and that the law works as is."]}, {"start": 19828, "title": "Hearing adjourned", "who": "Chair James F. Gennaro", "points": ["Closes the hearing at about 5 hours 30 minutes."]}], "speakers": [{"t": 80.8, "name": "James F. Gennaro", "role": "Chair, Committee on Environmental Protection and Waterfronts"}, {"t": 679, "name": "Alexa Avilés", "role": "Council Member (Intro 48 sponsor)"}, {"t": 1967.8, "name": "Alex Camarda", "role": "Senior policy advisor, Reinvent Albany"}, {"t": 2325.4, "name": "George Thurston", "role": "NYU School of Medicine (testifying for himself)"}, {"t": 2560.1, "name": "Margaret Perkins", "role": "350 NYC"}, {"t": 2707.1, "name": "Rocco J. Lacertosa", "role": "CEO, New York State Energy Coalition"}, {"t": 2867.1, "name": "Max Resnick", "role": "Brooklyn resident, program participant"}, {"t": 2990, "name": "Harvey Epstein", "role": "Council Member"}, {"t": 3788.1, "name": "Joseph Ferrara", "role": "Aggregate and Cement Trucking, Owner and president"}, {"t": 4086, "name": "David Atkin", "role": "Interior Demolition Contractors Association (attorney)"}, {"t": 4302.7, "name": "Felice Farber", "role": "Executive Director, Subcontractors Trade Association"}, {"t": 4440.0, "name": "Melissa Barbour", "role": "Assistant Director, Mechanical Contractors Association of New York"}, {"t": 5436.7, "name": "Eric Goldstein", "role": "Natural Resources Defense Council"}, {"t": 5597.6, "name": "Suhali Mendez", "role": "New York Lawyers for the Public Interest, Policy and legislative coordinator"}, {"t": 5861.9, "name": "Ryan Scott Lokey", "role": "Former delivery driver; environmental consultant"}, {"t": 6027.9, "name": "Evan Kalish", "role": "Eastern Queens resident and parent"}, {"t": 6324.2, "name": "Jonathan Goren", "role": "Testifying for himself"}, {"t": 7343.8, "name": "Elizabeth Crowley", "role": "President and CEO, Building Trades Employers' Association"}, {"t": 7615.8, "name": "Samuel Eluto", "role": "Building Trades Employers' Association"}, {"t": 7745, "name": "Zach Miller", "role": "Trucking Association of New York"}, {"t": 7842.8, "name": "Larry Zogby", "role": "CEO, RDS Delivery Service"}, {"t": 8706.8, "name": "Hayden Brockett", "role": "Testifying for himself"}, {"t": 8935.5, "name": "Alicia Raymond", "role": "Program participant"}, {"t": 9137, "name": "Rafil Kroll-Zaidi", "role": ""}, {"t": 9398, "name": "Kevin McGee", "role": "Program participant"}, {"t": 9762.8, "name": "Ernest Welde", "role": ""}, {"t": 9938.6, "name": "Nicholas Day", "role": "Co-CEO, Edge Auto Rental"}, {"t": 10092.9, "name": "Glen Avery", "role": "President, Bus Association of New York State"}, {"t": 10249.8, "name": "Patrick W. Condren", "role": "Administrator, Bus for NYC Coalition"}, {"t": 10715.1, "name": "Timothy David", "role": "Hell's Kitchen resident"}, {"t": 10876.8, "name": "Ileane Spinner", "role": ""}, {"t": 11062.9, "name": "George Packenham", "role": "Filmmaker; New York Clean Air Collective"}, {"t": 11209.6, "name": "Dietmar Detering", "role": "Queens resident, complainant"}, {"t": 11556.0, "name": "Mike Streeter", "role": "New York Clean Air Collective (testifying for himself)"}, {"t": 11704.9, "name": "Justin Bernstein", "role": "Program participant"}, {"t": 11841.5, "name": "Vlad Kucharavi", "role": "Program participant"}, {"t": 11998.8, "name": "Sarah O'Brien", "role": "Queens native"}, {"t": 12288.2, "name": "Dylan Stack", "role": "Vice President, New York Clean Air Collective"}, {"t": 12533.1, "name": "Oren Galchen", "role": ""}, {"t": 12677.4, "name": "Wanfang Wu", "role": ""}, {"t": 12871.5, "name": "Gregory Gonzalez", "role": ""}, {"t": 13007.9, "name": "Luis Palatano", "role": "Program participant since April 2022"}, {"t": 13482.5, "name": "Larry G. Lee", "role": "Testifying on his own behalf"}, {"t": 13893.1, "name": "Irena Goman", "role": "Uptown parent"}, {"t": 14135.5, "name": "Grant", "role": "Citizen complainant"}, {"t": 14436.4, "name": "Duc", "role": ""}, {"t": 14655.4, "name": "Tingting Wong", "role": "Bed-Stuy resident; former program participant"}, {"t": 14821.5, "name": "Robin Warren", "role": "Parent"}, {"t": 15111.7, "name": "Adam Thomas", "role": ""}, {"t": 15160.1, "name": "Peder Wessel", "role": "Works in tech"}, {"t": 15454.7, "name": "Josh Bisker", "role": "Former delivery driver; program participant"}, {"t": 15590.1, "name": "Dr. Seth Eisenberg", "role": "Physician"}, {"t": 15733.5, "name": "Eric Eisenberg", "role": "Attorney; New York Clean Air Collective board member"}, {"t": 15972.7, "name": "Jonathan Robidoux", "role": "Parent"}, {"t": 16198.4, "name": "Aaron Jacobs", "role": "Public school teacher"}, {"t": 16470.7, "name": "Alia Soomro", "role": "Deputy Director for NYC Policy, New York League of Conservation Voters"}, {"t": 16639.7, "name": "Nandini Kanesia", "role": "Engineering student, Purdue University"}, {"t": 16774.9, "name": "Hunter Severini", "role": ""}, {"t": 16921.5, "name": "Douglas Anderson", "role": "President, Anderson Coach and Travel"}, {"t": 17102.2, "name": "Michael McFadden", "role": ""}, {"t": 17256.2, "name": "Sarah Craig", "role": "Senior attorney, Conservation Law Foundation"}, {"t": 17447.6, "name": "Jason Chernow", "role": "Motor coach and limousine associations"}, {"t": 17628.9, "name": "Anthony Griffith", "role": "Transportation consultant; bus operator"}, {"t": 17786.7, "name": "Christopher Eke", "role": "Trucking industry"}, {"t": 18042.7, "name": "Patrick Kane", "role": "Senior safety director, Fullington Bus Company"}, {"t": 18179.0, "name": "Anne Diebel", "role": "Private investigator, Brooklyn"}, {"t": 18337.1, "name": "Thomas Bailey", "role": "Midtown East resident"}, {"t": 18449.6, "name": "Andrew Lynch", "role": "Executive Vice President, Hampton Jitney"}, {"t": 18690.3, "name": "Michelle Peteliki", "role": "President, Panorama Tours"}, {"t": 18754.0, "name": "Jim Whalen", "role": "Teamsters Local 817"}, {"t": 18944.5, "name": "Lou Dubouque", "role": "National Waste and Recycling Association, NYC chapter"}, {"t": 19098.5, "name": "Dr. Patrick Schnell", "role": "Pediatrician"}, {"t": 19249.1, "name": "Christine Berthet", "role": "Co-founder, CHEKPEDS"}, {"t": 19380.0, "name": "Rachel Optinaker", "role": ""}, {"t": 19449.0, "name": "David Sucher", "role": ""}, {"t": 19643, "name": "Chatterjee", "role": ""}], "segments": [[0.0, "Who is here from the administration? I know people are going to come to listen. Anybody"], [10.5, "here from the administration? I work this out with the City Legislative Affairs. That's"], [17.6, "someone who would be here in person to listen. Pardon? Okay, yeah, yeah, just, I'm just, I'm"], [24.6, "just asking a question. Okay, so you're from the administration. Okay, yeah, we're just,"], [31.6, "pardon? Yeah, yeah, yeah, because the administration, not testifying, but they promised they would"], [38.6, "send like a, you know, someone from the administration to listen to all the testimony. Of course,"], [46.3, "people say they're going to be watching it online, but nothing like having a person in"], [50.8, "the audience. Thank you for being here. Oh, so now I have to officially let you know to"], [55.6, "do whatever they have to do to start the hearing, right? Good afternoon, and welcome to New York"], [61.3, "City Council Committee on Environmental Protection and Waterfront. At this time, we're asking"], [67.2, "everyone to sign all electronic devices. If you have not signed up yet for testimony,"], [74.3, "please do so at the back with a sergeant at no time, and I want you to approach the VA."], [80.8, "Thank you. Thank you. Thank you. Good afternoon. I'm Council Member Jim Gennaro, Chair of the"], [95.3, "Committee on Environmental Protection and Waterfronts. Today, we'll be holding an oversight"], [99.5, "hearing on DEP's citizen enforcement programs, as well as the following legislation. Proposed"], [106.6, "intro 11A, sponsored by Speaker Julie Menin, in relation to increasing civil penalties for"], [113.7, "idling infractions. Intro 48, sponsored by Council Member Avila, as we'll be hearing"], [120.7, "from her, in relation to translating the citizen air complaint program portal into designated"], [128.0, "citywide languages. A pre-considered bill, sponsored by Council Member Crystal Hudson,"], [134.0, "in relation to idling violations in DOFs, in relation to the Department of Finance's"], [143.8, "fleet program, and three bills that I have sponsored. A proposed intro 561A, in relation"], [150.4, "to regulating the idling of engines and the use of citizens' complaints to enforce idling"], [158.6, "laws. Proposed intro 869A, in relation to establishing a code of conduct applicable"], [165.9, "to citizen noise complaints, and intro 562, in relation to establishing a program that"], [172.8, "transfers liability for certain engine idling violations to less ease of vehicles. The city's"], [182.9, "air quality has improved over the last 20 years, thanks in no small part to the Council."], [189.4, "Over that time, the Council has passed legislation to phase out dirty heating oil, regulating"], [194.6, "emissions from certain commercial cooking equipment, making the city fleet electric, and reducing"], [201.9, "emissions from certain types of buildings. Each of these laws has demonstrated the Council's"], [208.8, "commitment to making the air cleaner and safer for New Yorkers, while the air quality has"], [213.4, "improved, there is still work to be done, work that this committee takes very seriously."], [218.6, "Let me just go off script for a second and talk about some of the things that have happened."], [224.4, "I remember in one fell swoop, the Council working with the state eliminated the dirtiest"], [233.5, "fuel oil, number six oil. So six oil went out. Number four oil, many of you people know"], [239.6, "what that is, it's a blend of number two and number six. That was reduced from a sulfur"], [246.2, "content between like 3,000 and 4,000 down to 1,000 or 1,500. So it made four cleaner."], [256.2, "In conjunction with the state, we made number two, ultra low sulfur, ULSD, and we did something"], [272.6, "-- oh, and then we -- there was some other component to that, but those measures taking"], [279.7, "-- you know, taking together, you know, clean the city's air quality to the equivalent of"], [286.4, "taking every car, truck, and bus off the road forever. You know, that was a good thing, but"], [293.2, "we have to keep going, and the idling is a very big deal. I just thought I'd give you"], [298.5, "that little piece of history. Okay, back to script. Every year motor vehicles contribute"], [303.6, "approximately 11% of the local fine particulate matter. By that we mean PM2.5, people who"], [313.2, "know of air pollution know it, PM2.5, PM10, all that, where was I? And 28% of the local"], [324.7, "pollution oxide emissions. These emissions are harmful to human health, leading to hundreds"], [328.8, "of premature deaths and emergency department visits for respiratory and cardiovascular disease"], [333.3, "every year. What's more, what's more, communities of color are subjected to as much as 15% more"], [340.7, "fine particulate matter pollution from diesel trucks in a neighborhood with the greatest"], [345.2, "levels of pollution attributable emergency department visits are all EJ neighborhoods."], [354.4, "To address these air quality concerns, the New York City air code prohibits motor vehicles"], [358.4, "from idling for longer than one minute near a school or a park and for longer than three"], [363.4, "minutes elsewhere. Although a citizen complaint program process for these air code provisions"], [369.4, "has existed in local law since 1971 to better facilitate participation in the citizen complaint"], [375.9, "program in 2019, the city established the City Air Complaint Portal, which allowed the"], [382.7, "public to more easily submit evidence of idling to DEP. Since then, the number of idling complaints"], [388.8, "submitted each year has been climbing dramatically from 9070 complaints submitted in 2019 to"], [397.8, "163,090 complaints submitted in 2025. In that time, stakeholders, including DEP, have called"], [406.1, "upon the council to reform this program to make it more efficient and fairer for all"], [410.3, "involved as evidenced by the committee's hearing on citizen enforcement program and"], [415.2, "accompanying legislation in 2024. And again today, when did we last hear this bill? Yeah,"], [422.8, "so we last heard this bill in 2024. And again today, I'm committed as is this as is this"], [431.0, "committee to doing our best to make this program easier and fairer for all parties while maintaining"], [436.0, "the council's ultimate goal of reducing harmful air pollution. That leads us to today's hearing."], [442.9, "And although we invited DEP, OATH, the Office of Administrative Trials and, I guess, and"], [450.8, "Department of Finance to provide testimony about the citizen enforcement program and"], [455.2, "the proposed legislation being heard today, and despite DEP's previous insistence that"], [460.4, "the council make reforms to this program, as you can see, they have declined the invitation."], [466.5, "And then DEP has provided a page and a half of testimony without much substance. I will"], [472.8, "be reading that into the record. Feel free to giggle as I read it. And no word from OATH"], [479.0, "or DOF. The giggle part I just made up. It's not written down. Okay. I hope that moving"], [485.9, "forward the administration can show a bit more respect to this institution and the important"], [490.5, "role we play in oversight and lawmaking. While I'm disappointed by their absence, I look"], [495.1, "forward from hearing from you all today about your experience with the citizen enforcement"], [502.6, "program and your suggestions to make it better. Thank you for taking the time out of your"], [507.0, "day to make this a fruitful hearing with your good and thorough testimony. Hopefully the"], [511.7, "agencies will be listening in while we've got the person right there. And I'm sure they'll"], [518.6, "listen in. I'm sure they're like, you were giggling when I said giggling. They're not"], [523.3, "giggling. They're grimacing. So hopefully the agency will be listening in and taking"], [527.6, "notes. We certainly will. I would like to thank the committee staff, senior legislative"], [532.6, "counsels Natasha Bynum and Ciara Townsend. Natasha Bynum is here. The Ciara is remote."], [541.9, "Senior policy analyst Ricky Chala, financial analyst Tanveer Singh, as well as my legislative"], [548.7, "director Josh Gassette, who's sitting in the front row for all their hard work. I do want"], [555.0, "to recognize the other Ciara. We have Ciara Unger, so we have two Sierras, those Sierras,"], [565.7, "and she's an intern? What's that? A legal extern, okay. After the hearing, I'll find"], [574.5, "out what that means. Okay. I will recognize the great council members who have joined"], [582.9, "us. Here we go. Council member Sanchez, council member Hanks, council member Epstein, council"], [592.4, "member Avila is not a member of this committee, but has a bill, and she always shows up when"], [599.1, "her bills are heard. She's a great council member and a great American, if I do say so"], [604.2, "myself. Okay. Well, okay, all the council members are great Americans. Okay. As are"], [616.7, "all of you, this is like a Vatican of great Americans here. I invoked the Vatican. Oh,"], [628.3, "okay. So, yeah, so Mr. Entrance himself, Lincoln Restler, another great American, has joined"], [638.2, "us and, okay, as well as financial, Tanbur Singh, did I say that already? What am I up"], [647.0, "to? Okay. So, I know I've got to recognize the college, right? Did I do that? Oh, I did"], [658.3, "the college already. Yeah. I'm getting older, you know. Yeah, I'm going to recognize council"], [666.4, "member Avila's, yeah, yeah, yeah. And now it's my honor to recognize my good colleague,"], [674.6, "council member Avila's for a statement. Council Member Avilés."], [679.5, "Thank you. Thank you, Chair Gennaro, for always being very generous and lovely with your comments."], [686.5, "Thank you to the members of the committee and members of the public who have joined"], [689.2, "us here today. Today, the committee will hear one of my bills, Intro 48, which brings language"], [695.0, "justice to the fight for clean air in New York City. Idling vehicles are a major contributor"], [701.7, "of air pollution in our city. Cars and trucks idling on New York City streets produce 130,000"], [709.3, "tons of carbon dioxide a year. The consequences of this pollution are deadly, resulting in"], [715.8, "2,400 deaths each year in New York City. We see a disproportionate impact in communities"], [722.3, "like mine, environmental justice communities that bear the brunt of an enormous amount"], [730.4, "of siting of polluting infrastructures and certainly trucks. The citizen air complaint"], [736.7, "program has been a critical tool to boost enforcement capacity for the city's idling law. This program"], [742.6, "allows everyday New Yorkers to take on corporate polluters who harm their communities. Early"], [749.0, "this year, the city recovered $9 million from Amazon alone for one year, one of the city's"], [756.5, "most flagrant polluters. In a time where the federal government and the state government"], [762.9, "are rolling back environmental protections, it is a moment for the city to lean forward,"], [770.4, "ten toes down to strengthen and expand our programs that protect our residents. The citizens"], [777.5, "complaint portal is a vital tool for improving our city's air quality, but the fact that"], [784.4, "complaints must only be submitted in English limits its ability to deliver true environmental"], [791.6, "justice for our city, where nearly a quarter of the residents have limited English proficiency."], [797.9, "In fact, in my district, we are a majority foreign born district. 70 plus of my residents"], [807.2, "speak Spanish or Mandarin or Cantonese. They are effectively locked out from caring for"], [816.4, "their neighbors in this program. My bill intro 48 would require DP to translate the portal"], [823.8, "into each of these cities designated citywide languages. This bill is a step forward in"], [829.0, "addressing the deadly inequities of environmental justice communities that they currently face."], [835.5, "I thank the 38 council members who have signed on to intro 48 and encourage my colleagues"], [841.9, "to join in the fight for language justice and co-sponsor this bill and ensure that we"], [846.8, "have the strongest citizen complaint program and do everything in our power to hold polluters"], [852.3, "accountable in our city. Thank you so much. Thank you, chair."], [857.4, "Thank you, council member Avilés. I have a tradition in this committee which I've chaired"], [865.9, "for like 17 or 18 years, not consecutively, but cumulatively recognizing either words"], [873.6, "or expressions that have never been put on the record before in the committee while I've"], [880.6, "chaired it. I'm asking council to enter to make a note of the expression, \"Tentos down\""], [888.4, "has now been uttered in this committee for the first time since I've chaired it. Thank"], [895.9, "you, Alexa. Now it's my duty to read the testimony of DEP into the record. Before I do that,"], [909.7, "I'm just going to mention that there were many parties that approached me, approached"], [916.6, "other entities in the council and said, \"Don't have the hearing. It's a bad idea. One bill"], [925.4, "in particular, other bills still need work.\" I understand that, but the way we make bills"], [934.2, "better is to get input from the public. That's how this works. We heard the bill in 2024"], [945.4, "and now we're back. People are not satisfied with the amendments to the bill, which is"], [951.5, "precisely why we're here. I want to engage in a productive discussion with all stakeholders"], [960.5, "to make sure that we can figure out a bill that probably is not going to work for everybody,"], [966.9, "because it's going to be a balance. In 17 or 18 years of chairing this committee, I"], [978.2, "don't think I've ever passed a bad bill. In my antiquity, I don't plan on starting now."], [986.0, "I wanted to go forward with the hearing in absence of DEP. DEP works for us. I'm more"], [998.0, "interested in hearing from members of the public, from stakeholders, everyone who has"], [1005.7, "legitimate concerns, and you all do. I would hope that the testimony is constructive and"], [1015.8, "not heated, although I don't care what people say about me, so have at it, but this is my"], [1024.7, "goal and this is what's going to happen at the end of the day. I heard from a lot of"], [1029.2, "people, \"Don't do it. Don't do it. You're being set up.\" No, no, no, no. It's just"], [1034.0, "like we're going to go before both sides, three sides, four sides, whatever, and get"], [1040.8, "good testimony on the record and
