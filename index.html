const $ = id => document.getElementById(id);
const fmt = s => { s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; };
const vurl = s => `https://www.youtube.com/watch?v=${H.yt}&t=${Math.max(0,Math.floor(s))}s`;
const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('eyebrow').textContent = H.body;
$('title').textContent = H.title;
$('meta').innerHTML = H.meta.map(([k,v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join('') +
  `<span><a href="https://www.youtube.com/watch?v=${H.yt}" target="_blank" rel="noopener">Video on YouTube</a></span><span><a href="${H.video}" target="_blank" rel="noopener">Council's original file (4 GB)</a></span>`;
$('note').innerHTML = H.note;
$('foot').innerHTML = H.footer.map(t => `<div>${t}</div>`).join('');

// Chapters
$('toc').innerHTML = H.chapters.map((c,i) => `
  <article class="ch" id="ch${i}">
    <div class="ch-head"><h3>${esc(c.title)}</h3><span class="ts">${fmt(c.start)}</span></div>
    ${c.who ? `<div class="who">${esc(c.who)}</div>` : ''}
    <ul>${c.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    <div class="ch-actions">
      <a href="${vurl(c.start)}" data-t="${c.start}" target="_blank" rel="noopener">Watch from ${fmt(c.start)}</a>
      <button class="link" type="button" data-jump="${i}">Show in transcript</button>
      <a class="sug-btn" data-sug="ch" data-i="${i}" href="https://docs.google.com/forms/d/e/1FAIpQLSfjS9eN8nl6KLp1BsWPbHM6jh-eEOT08sWl9_z9rwK4KFW1rA/viewform" target="_blank" rel="noopener">Suggest a correction</a>
    </div>
  </article>`).join('');

// Transcript
const chStarts = H.chapters.map(c => c.start);
function chapterOf(t){ let k=0; for(let i=0;i<chStarts.length;i++) if(t>=chStarts[i]-0.5) k=i; return k; }
const rows = [];
let html = '', lastCh = -1;
const marks = (H.speakers || []).slice().sort((a,b)=>a.t-b.t); let mi = 0;
const whoOf = i => H.who ? H.who_names[H.who[i]] : '';
const whoText = w => w === 'Unclear' ? 'Speaker unclear' : w;
let prevWho = null;
H.segments.forEach((s,i) => {
  const ci = chapterOf(s[0]);
  let spk = '';
  while (mi < marks.length && marks[mi].t <= s[0] + 0.5) { const m = marks[mi++]; spk += `<div class="spk"><span class="spk-name">${esc(m.name)}</span>${m.role?`<span class="spk-role">${esc(m.role)}</span>`:''}</div>`; }
  if (ci !== lastCh) { html += `<div class="chap-mark" id="tc${ci}" data-ch="${ci}">${esc(H.chapters[ci].title)}</div>`; lastCh = ci; }
  if (spk) html += spk.replace(/class="spk"/g, `class="spk" data-ch="${ci}"`);
  const w = whoOf(i); let wl = '';
  const justMarked = spk && marks[mi-1].name === w;
  if (w && w !== prevWho && !justMarked) { const g = /\(\?\)$|^Unclear$/.test(w); wl = `<div class="who${g?' guess':''}">${esc(whoText(w))}</div>`; }
  prevWho = w;
  html += `<div class="seg" data-i="${i}" data-ch="${ci}"><span class="ts"><a href="${vurl(s[0])}" data-t="${s[0]}" target="_blank" rel="noopener" title="Play from here">${fmt(s[0])}</a></span><div>${wl}<p>${esc(s[1])}</p><div class="tools"><a class="sug-btn" data-sug="seg" data-i="${i}" href="https://docs.google.com/forms/d/e/1FAIpQLSfjS9eN8nl6KLp1BsWPbHM6jh-eEOT08sWl9_z9rwK4KFW1rA/viewform" target="_blank" rel="noopener">Suggest edit</a></div></div></div>`;
});
$('tx').innerHTML = html;
const segEls = [...$('tx').querySelectorAll('.seg')];
const markEls = [...$('tx').querySelectorAll('.chap-mark')];

document.addEventListener('click', e => {
  const b = e.target.closest('[data-jump]'); if(!b) return;
  const i = +b.dataset.jump;
  if ($('q').value) { $('q').value=''; runSearch(); }
  const m = $('tc'+i); if (m) $('tx').scrollTop = m.offsetTop - $('tx').offsetTop;
  document.querySelectorAll('.ch.on').forEach(x=>x.classList.remove('on'));
  $('ch'+i).classList.add('on');
  if (window.matchMedia('(max-width:860px)').matches) $('tx').scrollIntoView({block:'start'});
});

function runSearch(){
  const q = $('q').value.trim();
  let n = 0;
  const re = q ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi') : null;
  const visCh = new Set();
  segEls.forEach(el => {
    const t = H.segments[+el.dataset.i][1];
    const p = el.querySelector('p');
    if (!re) { el.hidden=false; p.innerHTML = esc(t); return; }
    re.lastIndex = 0;
    const hit = re.test(t);
    el.hidden = !hit;
    if (hit) { n++; visCh.add(el.dataset.ch); p.innerHTML = esc(t).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`); }
    else p.innerHTML = esc(t);
  });
  markEls.forEach(m => m.hidden = !!re && !visCh.has(m.dataset.ch));
  document.querySelectorAll('.spk').forEach(m => m.hidden = !!re);
  $('count').textContent = re ? `${n} passage${n===1?'':'s'}` : `${segEls.length} passages`;
  $('tx').scrollTop = 0;
}
let tmr; $('q').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(runSearch, 150); });
runSearch();

// ---- Suggest a correction: opens the Google Form, pre-filled. No sign-in needed. ----
const FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSfjS9eN8nl6KLp1BsWPbHM6jh-eEOT08sWl9_z9rwK4KFW1rA/viewform';
const ENTRY = { where: 'entry.1311600468', current: 'entry.1837386154', correction: 'entry.541394134' };
const clip = (s, n) => s.length > n ? s.slice(0, n) + '…' : s;
function formUrl(kind, i){
  let where, text;
  if (kind === 'seg') { const s = H.segments[i]; where = 'Transcript line ' + fmt(s[0]) + (whoOf(i) ? ' · speaker: ' + whoText(whoOf(i)) : ''); text = s[1]; }
  else { const c = H.chapters[i]; where = 'Chapter summary ' + fmt(c.start) + ' · ' + c.title; text = clip([c.title, c.who || '', ...c.points.map(p => '• ' + p)].filter(Boolean).join('\n'), 1800); }
  const q = new URLSearchParams({ usp: 'pp_url' });
  q.set(ENTRY.where, where); q.set(ENTRY.current, text); q.set(ENTRY.correction, text);
  return FORM + '?' + q.toString();
}
// Fill in each link's address just before it is followed, so the page stays small.
['pointerdown', 'focusin', 'mouseover'].forEach(ev => document.addEventListener(ev, e => {
  const a = e.target.closest && e.target.closest('a[data-sug]'); if (!a || a.dataset.ready) return;
  a.href = formUrl(a.dataset.sug, +a.dataset.i); a.dataset.ready = '1';
}, true));

// ---- Embedded YouTube player: timestamps play in place ----
let YTP = null, ytReady = false;
window.onYouTubeIframeAPIReady = () => {
  YTP = new YT.Player('yt', { videoId: H.yt, playerVars: { rel: 0, playsinline: 1, modestbranding: 1 },
    events: { onReady: () => { ytReady = true; } } });
};
(() => { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-t]'); if (!a || !ytReady) return;   // no player yet: link opens YouTube instead
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  YTP.seekTo(Math.max(0, +a.dataset.t - 1), true); YTP.playVideo();
  const pl = document.querySelector('.player'); const r = pl.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) pl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
// Highlight (and optionally follow) the line being played.
const segTimes = H.segments.map(s => s[0]); let lastNow = -1;
setInterval(() => {
  if (!ytReady || !YTP.getPlayerState || YTP.getPlayerState() !== 1) return;
  const t = YTP.getCurrentTime(); let lo = 0, hi = segTimes.length - 1, k = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (segTimes[m] <= t) { k = m; lo = m + 1; } else hi = m - 1; }
  if (k === lastNow) return;
  segEls[lastNow]?.classList.remove('now'); const el = segEls[k]; el?.classList.add('now'); lastNow = k;
  if ($('follow').checked && el && !el.hidden && !$('q').value) $('tx').scrollTop = el.offsetTop - $('tx').offsetTop - 40;
}, 700);
</script>
