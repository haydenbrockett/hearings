take the clay that's on the potter's wheel now and"], [1048.1, "making it to something that we can all like. That's what we're going to do and appreciate"], [1058.1, "everyone being here. Someone even brought their little bit. There he is back there."], [1065.9, "The youngest environmentalist right there. What's that? All right, well, okay, so from"], [1073.5, "now on, no talking during this hearing. There'll be no testimony. There'll be nothing. We will"], [1079.6, "just sit and meditate, you know, and until the baby's like safely asleep. Okay, here"], [1087.8, "we go. Testimony of Lisa Garcia, Commissioner of DEP. Good afternoon, Chairman Gennaro, members"], [1097.1, "of the Environmental Protection and Waterfront Committee. I am Lisa Garcia, Commissioner"], [1101.7, "of DEP. I'm happy to provide some information about the operation of our citizen complaint"], [1107.0, "program. However, on the advice of counsel and related litigation, I will not be in attendance"], [1111.2, "at the hearing. And at this time, I'll not provide comments on intro 11A or intro 561A."], [1124.4, "Sip of water is what it says in here, so I'll follow it. New York City's civilian complaint"], [1134.8, "program allows anyone to record and submit evidence of certain idling, dust, and sound"], [1140.9, "reproduction device violations, and then receive a share of the penalties collected if the"], [1146.6, "evidence results in a violation. These programs have become increasingly proper in recent years,"], [1151.7, "particularly the program for idling enforcement. Like a little frog in my throat here. I had"], [1160.4, "a sticky bun. Maybe that's it. And it has a chart here, talks about complaints submitted,"], [1169.9, "you know, and it's a lot of numbers, and then numbers issued, whatever. I'm not going to"], [1176.0, "do the charts. To participate in the idling program, anyone can log into the air complaint"], [1182.8, "system on the DEP website and submit a video on the idling with the description of the"], [1188.2, "incident. Two DEP staff, including a supervisor, review each submission to determine whether"], [1194.2, "there is evidence of a violation, and issue summonses when sufficient evidence is observed."], [1199.3, "Either DEP or the citizen can pursue the complaint. If DEP pursues, we issue summonses after the"], [1205.9, "review once sufficient evidence is observed. If the citizen pursues, they issue the summons"], [1211.6, "themselves. The summons leads to a hearing before OATH. The person who submitted the"], [1218.7, "complaint is informed of the hearing date and can follow the progress of their submission"], [1224.1, "through the air complaint system. Anybody got a cough drop? Anybody?"], [1232.9, "Thank you. Thank you. Oh, Ricola. Now we're talking. Appreciate that. Where are we? In"], [1251.8, "2025, DEP reviewed more than 163,000 submissions from the public and issued about 102,000 summonses"], [1259.2, "for idling, almost 300 summonses issued per day. As the council is aware, this has been an"], [1266.1, "exponential increase over just a few years. And then there's a little question mark between the"], [1276.5, "two paragraphs. I don't know what that means. Currently, DEP receives about 700 idling reports"], [1282.8, "per day, each reviewed by a DEP inspector and supervisor. We have a current backlog of about"], [1289.4, "230,000 videos that DEP must review. DEP received 21 new lines, personnel lines, approved as part"], [1301.4, "of the FY27 November plan. These new positions include air pollution inspectors, clerical"], [1306.9, "associates, principal administrative associates, and one certified IT developer. Seven inspectors"], [1315.0, "recently started. We are working with the Department of Citywide Administrative Services"], [1319.0, "and the Office of Management and Budget to bring the rest on as soon as possible."], [1323.4, "Citizen complaints are adjudicated at OATH, which also support the processing of payments. The"], [1328.8, "council should consider the operational impacts in adjudicating and processing citizen complaints"], [1335.0, "of these cases when making changes to the law. Six pieces of legislation are being heard today. The"], [1340.6, "details of some of these bills relate to current litigation. Therefore, I cannot speak to items"], [1345.8, "in the bills that touch on legal issues being litigated. But they do have, you know, thoughts"], [1352.1, "on some other bills, and I'm going to read those now. Intro 48. Intro 48 requires that the citizens"], [1357.7, "air complaint website and its components be available in the desert wide and designated"], [1363.3, "citywide languages. DEP is already compliant with the bill, okay, because the website currently"], [1372.6, "has instructions and translations in all of the designated citywide languages. We encourage New"], [1379.9, "Yorkers of all backgrounds to participate in the compliant program. I'm just reading what's"], [1385.1, "on the paper. Okay. Intro 562. 562 would establish a program that transfers liability for certain"], [1393.9, "engine idling violations to lessees of vehicles. DEP issues summonses to vehicle owners based on"], [1403.3, "the license plate or other identifying information on the vehicle scene idling. The evidence we"], [1411.0, "receive does not indicate who is driving the vehicle at the time of the violation. Often,"], [1417.8, "there isn't any driver present. If the vehicle is leased, that is also not indicated in the"], [1424.7, "evidence collected. We have concerns about this proposal, such as removing the vehicle owner's"], [1432.0, "incentive to install anti idling equipment in vehicles. Intro 869. Intro 869 would establish"], [1440.6, "a code of conduct applicable to citizen noise compliance. We appreciate and support the intent"], [1446.3, "of this bill. Additionally, OATH already has rules of conduct for citizen complainants that are"], [1454.6, "strictly enforced when adjudicating these matters. Pre-considered bill T20262662. The pre-considered"], [1466.5, "bill requires the Department of Finance to provide DEP a list of companies and registration"], [1474.5, "plates enrolled in its fleet program and requires DEP to send DOF a list of all idling notices of"], [1483.6, "violation issued for vehicles enrolled in the fleet program. We are reviewing this legislation"], [1490.0, "with our colleagues at the Department of Finance. I defer to them for discussion about their"], [1496.1, "concerns. Thank you for the opportunity to submit testimony today. Okay. We got that out of the way"], [1504.0, "and now we're going to start hearing from real people. I think it's -- what am I doing here?"], [1510.8, "How am I going to do the thing? >> Chair, can we get copies of their testimony?"], [1514.6, ">> Oh, sure. Yeah. I'm going to -- yeah. So the council of the committee will email it to all"], [1524.6, "members. Yeah. Sure. Thank you, Harvey. Public comment period. At the beginning of the public"], [1534.7, "comment period -- oh, sorry. It's just a note saying that I have to read this. Okay. Let me"], [1540.4, "just go with what I have to read. I remind members of the public that this is a formal government"], [1545.3, "proceeding, sort of, and that decorum shall be observed at all times. As such, members of the"], [1551.9, "public shall remain silent at all times, well, I guess, except when they're testifying. The"], [1557.7, "witness table is reserved for people who wish to testify. No video recording or photography is"], [1563.4, "allowed from the witness table. Further, members of the public may not present audio or video"], [1569.8, "recordings as testimony, but may submit transmits, the transcripts of such -- of such recording to"], [1576.2, "the Sergeant in Arms for inclusion in the hearing record. If you wish to speak at today's hearing,"], [1581.3, "please fill out an appearance card with the Sergeant in Arms and wait to be recognized."], [1586.0, "When recognized, you will have two minutes to speak on today's hearing topic, DEP citizen"], [1590.9, "enforcement programs, and accompanying legislation to be heard today. Yeah, because this is also an"], [1597.4, "oversight hearing as well as a legislative hearing. If you have a written statement or additional"], [1601.4, "testimony you wish to submit for the record, please submit a copy of that testimony to the"], [1605.6, "Sergeant in Arms. You may also e-mail written testimony to testimony@council.nyc.gov within"], [1616.0, "72 hours of this hearing. Audio and video recordings will not be accepted. I'm about to"], [1622.9, "call the first panel, and I want to -- and I want to note that, you know, when it comes to"], [1634.5, "arranging the panels, I have instructed, as I always do, the staff to arrange,"], [1643.4, "you know, the panels in such a way that it is fair and we get both sides and one group"], [1650.3, "doesn't have to wait three hours to testify. And I don't want it known for the record that I"], [1659.4, "play no role whatsoever in figuring out who's testifying when, what panels are first or last"], [1665.4, "or whatever that is left to staff. I trust them implicitly. They always do a good job."], [1670.3, "But when it comes to the panels, I have no say in who goes first. With that said, here is the first"], [1676.6, "panel. >> Can I say something?"], [1680.0, ">> Sure. I recognize Council Member Avilés. >> I know we want to get into the panels, but I"], [1687.2, "felt compelled to respond to the administration's claim that -- did they have done that in terms of"], [1696.2, "translating the portal? So I think for my exploration in these several minutes, it is true that a form"], [1705.0, "guidance has been translated separately. So we will provide kudos to the administration that"], [1710.3, "actually there is a form there that is translated that will guide someone. But what this requires"], [1716.3, "for the record is that an individual go into the website, print out the form, then go back to the"], [1723.4, "website and use the form and then go back to the website to translate each one manually in their"], [1732.3, "head. This is a crazy way of doing things. It is not integrated. What we are asking for is a full"], [1739.8, "integration where you go to one place, you make your reports, you submit your documentation and"], [1745.6, "evidence, not that you have to have a menagerie of documents and, you know, investigative lenses to"], [1753.8, "figure out how to navigate the two things. So administration, you are on your way. You have"], [1759.3, "not yet arrived to the promised land. Thank you. >> Thank you. Thank you, Councilmember."], [1765.6, "And when it comes to portals, I see many doctors and now it is the ear of the patient portal."], [1772.0, "And so I instruct my doctors to send me the stuff on the patient portal in a language that I do"], [1780.6, "not understand. So that way -- because I want the doctor to tell me what is wrong with me. I don't"], [1785.6, "want to read it and then go on Google and say, oh, my God, what have I got? And so -- okay."], [1794.5, "Okay. Council, the committee is reminding me, number one, to get back to business,"], [1800.6, "and two, to let people know who are -- who have entered the room since I"], [1807.0, "talked about the rules, that if they wish to speak, they should see the sergeant in arms,"], [1812.2, "fill out an appearance slip, and then they will be called in turn. And so the first panel,"], [1823.2, "Alex -- I can't make out the last name -- from Reinvent Albany. Is this first panel, too?"], [1831.8, "Sure. Come on up. George Thurston from the NYU School of Medicine, although he is representing"], [1844.9, "himself. And Rocco Lacerda from New York State Energy Coalition. Margaret Perkins from 350 NYC."], [1867.4, "Max Resnick gives a street address, presumably representing himself. He gives no organization."], [1880.8, "Hold on. I need to -- hang on. Let me just get a piece of paper to make notes."], [1894.3, "Can we fit everybody? Didn't we call them ovens?"], [1905.3, "Sure. Max Resnick, Margaret Perkins, Rocco Lacerda, Alex from Reinvent Albany,"], [1915.8, "George Thurston. And so -- okay. All right. And why don't we go from my right to my left,"], [1930.6, "and let's see who submitted the testimony. We have one testimony, right? Okay. And"], [1944.6, "Alex Camarda. I'm happy to hear your good testimony. The sergeant will tell you when"], [1960.5, "to start, and you have two minutes to give you a good testimony."], [1967.8, "Thank you, Chair Gennaro. My name is Alex Camarda. I'm a senior policy advisor for Reinvent Albany,"], [1972.8, "a government watchdog group. Reinvent Albany supports the Civilians Air Complaint Program,"], [1978.7, "believing it's a creative, innovative way to leverage civic-minded New Yorkers to extend the"], [1986.2, "compliance reach of the Department of Environmental Protection to enforce laws against idling."], [1994.6, "We're concerned by the bills before the committee today, in particular 561A and intro 11, both of"], [2001.4, "which we oppose. We oppose 561A because it creates numerous loopholes that will result in more idling,"], [2009.3, "more air pollution, more asthma, and more related diseases like cancer and heart disease."], [2015.9, "These loopholes include diesel regeneration, enabling buses to idle anywhere along their"], [2022.1, "routes, enabling buses to idle for 30 minutes without clear beginning and end points,"], [2027.5, "allowing vehicles to idle due to undefined mechanical problems, allowing vehicles that"], [2033.5, "have auxiliary battery-powered units in good working condition, which is undefined, to also idle."], [2041.6, "More importantly, these loopholes will make it difficult for both complainants and the DEP"], [2048.7, "to discern between an exception to the idling law and improper idling."], [2058.5, "DEP and complainants – I'm sorry, I already mentioned that. We also oppose intro number 11"], [2066.6, "because we think that increasing the fines is unnecessary. We think the current fine levels are"], [2073.6, "changing behavior already, and idling has been greatly reduced in many neighborhoods across the"], [2078.6, "city. We also think that it will increase delinquency on the part of respondents,"], [2085.6, "the commercial vehicle companies. What we see for fines above $1,000 currently is that the"], [2092.2, "delinquency rates are 60 percent or higher, so that will cause complainants to not participate"], [2099.4, "because they will not be paid their incentive because the companies won't be paying. Thank you."], [2103.9, "Thank you. As people testify, it would be important – and I think you were pretty clear – that"], [2121.8, "I would be interested to know from everybody who testifies who has an"], [2126.0, "issue with 561, whether they believe that 561 is resurrectable or just forget about the whole"], [2141.3, "thing. Because when you say oppose it, it means that there was nothing we can really do to it,"], [2147.0, "to make it fair or better or whatever. So I'm taking your testimony as just an outright"], [2156.0, "opposition to 561. And those who believe that 561, with appropriate amendments,"], [2169.9, "could be made into a bill that could work, I would like to hear that as well. It's fine to"], [2177.1, "oppose it. But if people have – and you did indicate some things that were problematic,"], [2182.6, "so we'll take that into account. But to the extent that people have testimonies – testimony"], [2189.2, "that says, \"I've got a problem with 561, and I think you need to do this, this, this, and this.\""], [2194.6, "And in a way, your testimony touched on that. But to the extent that people can be explicit"], [2204.1, "and say, \"The current paradigm works, we like it, and we don't want it touched,\" that's perfectly"], [2212.7, "fine testimony. And to the extent that you have testimony that you want to submit after the fact"], [2222.6, "about what could be done about some of the problems that you mentioned, we'll be happy to review it."], [2228.8, "But we certainly appreciate your testimony. And again, I'm not talking just to you,"], [2232.6, "but to everyone. We're trying to make this constructive and possible. We're trying to get"], [2237.4, "561 to work. If you think it can never work, that's perfectly acceptable testimony."], [2243.6, "And with that said, I'm going to go on to the next witness."], [2249.0, "Did you have to come down from Albany to be here? Go ahead, let him say."], [2254.7, "Now, we're based in New York City. We have staff in Albany as well."], [2258.6, "Oh, okay. All right. Just in response to what you just raised, I didn't actually ask a question, but"], [2266.4, "I'll tell you what. I'll tell you what, it's just like, I know we're going to have a long hearing,"], [2271.3, "but you're the first witness, so you get the first witness prize. And so why don't you"], [2276.2, "make a comment in response to what I just said? So I'm asking you a formal question."], [2281.0, "In relation to 561A, respectfully, I don't think it's fixable. I think where the council should be"], [2286.6, "focused is on due process. I think there's agreement between the industry and the"], [2291.0, "complainants and environmental groups and civic groups like reinvent Albany,"], [2294.9, "that due process should be expedited. I think everybody agrees with that."], [2298.8, "Oath and DEP need more resources, as you talked about at the beginning."], [2302.6, "And I think that's where everyone would agree. We want to see complaints processed more quickly."], [2309.0, "The industry deserves to get those complaints in a timely manner, and complainants will get paid"], [2313.4, "faster, and you'll see a change in behavior faster for those commercial vehicle companies"], [2319.0, "that are getting complaints for the first time. Okay. Thank you. Please."], [2325.4, "Good afternoon. Yeah, it's George Thurston. I work at the New York University School of Medicine."], [2330.6, "I live outside the city, but I commute in, and I walk from Grand Central to my office a little"], [2335.4, "over a mile. So I experience these kinds of pollution, and probably more noticeable to me"], [2341.6, "because I often carry a pollution monitor, which I recommend, a portable one. And I actually..."], [2349.1, "And we'll let you go on a little bit. What kind of device do you carry?"], [2354.1, "Portable particulate matter monitor. Okay. Anyway, and I'll present some of those data in my written."], [2362.1, "And I study health effects of air pollution. I published, you mentioned the PM2.5."], [2368.1, "I published the very first paper relating PM2.5 to mortality in the United States in 1987."], [2375.1, "The US EPA cited my research when they set the standard in 1997."], [2381.1, "And so, and I've done studies here in the United States and well throughout the United States,"], [2386.1, "but in New York City of Children's, the backpack study, that was mine."], [2390.1, "I've done a number of studies in New York showing the continuing effects of this on,"], [2395.1, "not just from this particular problem, but from diesel, especially particles in this city."], [2402.1, "And so we need to take vigorous action. So I commend the committee for taking this on and enforcing these idling rules."], [2411.1, "However, I also am concerned about the exemptions, such as for regeneration, clean cycles,"], [2418.1, "and could be potential loopholes and should be avoided. That's in 561-A."], [2425.1, "I, you know, I've done a lot of work with power plants and they get exemptions, something like this."], [2432.1, "And where it says, well, if they change operations, they're allowed to admit for a short period of time."], [2437.1, "And you wouldn't believe how many times they call on that."], [2440.1, "It's just, and the emissions of the annual emissions go way up because they just do it and they just mark it down."], [2446.1, "We just did this. So I think it's really human nature being what it is."], [2451.1, "And it doesn't sound like you can find out whether it really was happening or not."], [2455.1, "Please continue because I held you up for a couple of moments with your other thing."], [2459.1, "So just in conclusion, I think that we need to be more proactive in enforcement."], [2465.1, "You know, and you mentioned hiring some new people, maybe more of that."], [2469.1, "And I also think looking at solutions, not just these kind of extreme events, you know, idling,"], [2476.1, "but it's a general problem. We're bathed in pollution from traffic every day."], [2483.1, "We walk around and if you compare where I live out in Westchester, when I come into work,"], [2488.1, "that's where I get all my exposure to pollution every day."], [2492.1, "So we need to do things like giving incentives for EV trucks, heavy duty trucks."], [2499.1, "And to drive that switchover off diesel. So we need to get them as long as possible."], [2506.1, "Professor, I'm going to have to step in because I'm going to have to step in and enforce the time limit."], [2514.1, "OK. That's all I have to say."], [2516.1, "I just really appreciate all the work you've done on PM2.5 because forever it was like PM10."], [2523.1, "And then we got smart because of you. And PM2.5 is a very different animal than PM10."], [2532.1, "And we certainly appreciate all the work that you've done."], [2538.1, "You know, please put the professor on our ringers list because he's a ringer."], [2544.1, "And so that's a compliment."], [2548.1, "Yeah. OK. Thank you very much, Professor."], [2551.1, "Please, the next witness, if you could take the microphone."], [2555.1, "Yeah, that's probably the closest one."], [2560.1, "Good afternoon. My name is Margaret Perkins and I'm a member of the Climate Group 350 NYC."], [2566.1, "And we have been instrumental in the major climate laws that have been passed in this city."], [2571.1, "We're very proud of them, including Local Law 97."], [2575.1, "And they pull back on fossil fuels and buildings."], [2581.1, "I want to say everybody's probably going to say the same thing about the intricacies of this Law 561."], [2587.1, "And we're very much opposed to it."], [2589.1, "But I think we forget the bigger picture right now."], [2592.1, "And the bigger picture is that we are in a climate crisis."], [2596.1, "And we have seen the summer, the heat, the bushfires."], [2601.1, "We have to do everything we can to reduce the pollutants from fossil fuels."], [2606.1, "They are causing a major source of heating of this planet."], [2611.1, "And New York City has a duty to do everything it can."], [2615.1, "And this includes a bill that works in terms of stopping idling."], [2621.1, "It's a major contribution and trucks are 80 percent of the pollution from vehicles."], [2626.1, "And we have to figure it out."], [2628.1, "And I just want to say that New York City has figured out a lot of problems already,"], [2632.1, "which James Gennaro has been instrumental in, Local Law 97."], [2638.1, "Everyone said you can't do it, you can't get the buildings to change."], [2641.1, "We have already shown that we have reduced emissions from buildings by five percent"], [2646.1, "in the first year where it was mandated."], [2649.1, "So if people do want a change, they will do what has to be done."], [2654.1, "We've done that with congestion pricing."], [2656.1, "Oh my God, this was going to be the end of New York City."], [2660.1, "It's working."], [2661.1, "Particulate matter is down."], [2663.1, "Vehicles are down."], [2664.1, "Accidents are down."], [2665.1, "So I say we can do idling as well."], [2668.1, "We have the expertise and the drive and motivation."], [2674.1, "Thank you."], [2675.1, "Thank you very much for your good testimony."], [2676.1, "We appreciate you coming back again to testify."], [2679.1, "And so we do appreciate that."], [2683.1, "Thank you."], [2686.1, "Yes."], [2687.1, "Let me get my slips in order here."], [2694.1, "Okay."], [2696.1, "Mr. Lacertosa, please."], [2698.1, "Thank you."], [2699.1, "Good afternoon, Chair."], [2700.1, "Oh, you just speak right into the microphone."], [2701.1, "It's hard to hear."], [2702.1, "Yeah, you got to get --"], [2703.1, "Good afternoon, Chair Gennaro and members of the Committee on Environmental Protection"], [2706.1, "and Waterfronts."], [2707.1, "My name is Rocco J. Lacertosa."], [2709.1, "I'm the CEO of the New York State Energy Coalition, or NYSEC."], [2712.1, "NYSEC represents liquid heating fuel distributors"], [2715.1, "in the fire boroughs of New York City,"], [2717.1, "Lower Westchester, Nassau, and Suffolk Counties."], [2719.1, "Our members are predominantly small and medium-sized,"], [2722.1, "multigenerational businesses that provide an essential service"], [2725.1, "to homes and businesses throughout the region."], [2727.1, "NYSEC supports effective enforcement of New York City's idling laws"], [2731.1, "and does not condone unnecessary idling."], [2734.1, "But enforcement must distinguish unnecessary idling"], [2737.1, "from engine operation that is necessary to perform an essential service."], [2741.1, "That distinction is particularly important."], [2744.1, "Heating fuel delivery trucks must operate pumps"], [2746.1, "to safely and efficiently deliver fuels to homes,"], [2749.1, "apartment buildings, and businesses."], [2751.1, "That is not unnecessary idling."], [2753.1, "We strongly support intro 561A's recognition"], [2756.1, "of pumps used in fuel delivery as a legitimate use,"], [2759.1, "and we urge the Council to ensure the final language clearly protects drivers"], [2764.1, "as when engine operation is necessary to complete a fuel delivery."], [2768.1, "NYSEC also supports the bill's exemption"], [2771.1, "for required diesel particulate filter regeneration cycles."], [2775.1, "Drivers should not face an idling violation"], [2778.1, "for operating a vehicle in compliance with environmental regulations."], [2782.1, "We support the broader reforms in intro 561A,"], [2786.1, "including replacing percentage-based complainant awards"], [2790.1, "with fixed amounts, establishing reasonable enforcement timelines,"], [2794.1, "and ensuring that respondents receive the video"], [2796.1, "and electronic evidence underlying a violation."], [2799.1, "These reforms will make the program more fair, reliable,"], [2801.1, "and focused on genuine compliance rather than financial incentives."], [2805.1, "NYSEC also supports intro 869A"], [2808.1, "and its safeguards against the fraudulent evidence"], [2810.1, "and other abuse of citizen complaint process."], [2813.1, "Finally, NYSEC opposes intro 11A at this time."], [2816.1, "The Council should first implement"], [2818.1, "and evaluate the important reforms in intro 561A"], [2822.1, "before increasing penalties, particularly for the small businesses"], [2826.1, "that make up our membership."], [2828.1, "Higher penalties should not come before a fair"], [2830.1, "and reliable enforcement process."], [2833.1, "NYSEC urges the Council to advance intros 561A and 869A."], [2837.1, "Thank you for the opportunity to testify today."], [2839.1, "Thank you, Mr. Lacertosa."], [2841.1, "I always appreciate working with NYSEC"], [2844.1, "and appreciate your, you know, continuing, you know,"], [2848.1, "involvement in this process."], [2850.1, "If I had more time, I would speak about what our industry has done."], [2853.1, "So when I'm done, I'm going to ask questions of the panel,"], [2857.1, "and so people might have an ability to get another word in."], [2863.1, "And our final panelist on this panel?"], [2867.1, "Hello, my name is Max Resnick."], [2869.1, "Are we good on time?"], [2870.1, "Cool."], [2871.1, "I am a Brooklyn resident"], [2873.1, "and a participant in the Citizen Complaint Program."], [2876.1, "I am testifying asking that the Council withdraw 561A"], [2880 ions in the bill,"], [3068.1, "how does that create cleaner air?"], [3071.1, "I don't know that it does one way or the other."], [3074.1, "But all I can tell you is that there is no way to make a delivery"], [3076.1, "without using a pump."], [3078.1, "So basically, the current technology doesn't allow a system"], [3083.1, "to operate the pump without the engine being on."], [3088.1, "Correct."], [3089.1, "And there's no system available now that allows that to happen?"], [3092.1, "No."], [3093.1, "And you're saying technologies have a path forward on this?"], [3097.1, "I don't design trucks."], [3099.1, "You don't design trucks."], [3100.1, "It's above my pay grade."], [3101.1, "That's right."], [3102.1, "It's possible that technology is out there."], [3104.1, "It could be."], [3105.1, "And that building, trucks can move towards that technology."], [3108.1, "And that may reduce the environmental consequences as well as the idling"], [3112.1, "issue."], [3113.1, "Absolutely."], [3114.1, "Because people are only, you're saying they're only idling now is because"], [3117.1, "they have to because they want the pump to work."], [3120.1, "Right."], [3121.1, "So if there's a technology that was available that allowed them to not idle"], [3124.1, "while the pump was working."], [3126.1, "We would certainly use it."], [3127.1, "You would certainly use it."], [3128.1, "So it doesn't seem like changing the law to allow more idling would make sense"], [3131.1, "except maybe allowing figuring out their technology exists to allow the"], [3135.1, "pump to work without idling."], [3137.1, "Correct."], [3138.1, "Yeah."], [3139.1, "Great."], [3140.1, "So as one of the other panelists, the other panelists seem to be not"], [3143.1, "supportive of this bill."], [3145.1, "Am I going that, like, are we saying that the change in this law would hurt"], [3150.1, "the environmental regulations, hurt the environment, increase particulate"], [3154.1, "matters?"], [3155.1, "Is that what I hear you all saying?"], [3157.1, "Nodding, maybe just articulate that in the mic because we need to have it on"], [3160.1, "the record."], [3161.1, "Yeah."], [3162.1, "Well, I think the implementation would not allow the kind of improvement you"], [3167.1, "could get from the proper bill that the exemptions would undermine it,"], [3172.1, "basically."], [3173.1, "So the exemptions in the bill could undermine the whole intent of the law?"], [3177.1, "Correct."], [3178.1, "Right."], [3179.1, "And so it does seem like with the chair's goal here is to try to make an"], [3184.1, "industry viable, which we all want to do."], [3187.1, "We don't want to undermine this industry without undermining the"], [3191.1, "environment at the same time."], [3192.1, "So there's got to be some path, which is what I hear people talking about,"], [3196.1, "of maybe changing the way the industry functions, but also without"], [3199.1, "undermining the goals and the law."], [3203.1, "Do you want to?"], [3204.1, "Yeah."], [3205.1, "Go ahead."], [3206.1, "I'm sorry."], [3207.1, "Okay."], [3208.1, "Yeah."], [3209.1, "I just think with a number of the exceptions, as I mentioned in my"], [3212.1, "testimony, I feel like they make the program inoperable."], [3217.1, "It's more than just increasing idling or increasing pollution."], [3220.1, "I don't think complainants, you know, everyday New Yorkers who are"], [3223.1, "filming videos of idling trucks are going to be able to tell if they're"], [3227.1, "doing diesel regeneration or if their auxiliary battery-powered unit is"], [3233.1, "working or if they have a mechanical problem."], [3235.1, "I'm not even sure what that is."], [3237.1, "So, and I think DEP will similarly struggle."], [3240.1, "So I think it makes the program inoperable in addition to increasing pollution."], [3244.1, "So I do also want to ask the panel we've heard from written testimony from"], [3249.1, "DEP that they are concerned about the volume of complaints that are coming"], "], [3347.1, "I'm sorry."], [3348.1, "I missed your first name."], [3349.1, "George."], [3350.1, "George."], [3352.1, "In your study, can you just briefly describe for the record the"], [3357.1, "disparities of PM 2.5 in environmental justice communities and more"], [3362.1, "wealthier communities?"], [3365.1, "Yes."], [3366.1, "I have done studies, especially in the South Bronx, and we see much, you"], [3371.1, "know, higher levels, especially diesel."], [3374.1, "I mean, basically, if you're in the South Bronx and you're near one highway,"], [3379.1, "if you move away from it, you're moving towards another highway."], [3382.1, "It's enveloped by highways all around it in every direction."], [3385.1, "Harlem's a lot alike that."], [3387.1, "So they're major throughways."], [3390.1, "And then there's congestion."], [3392.1, "And congestion pricing is not helping them much."], [3398.1, "Although we have seen generally lower air pollution levels following the"], [3403.1, "congestion pricing throughout the city with some hot spots."], [3406.1, "But anyway, so that -- and the effects of them."], [3411.1, "One of my studies, we have one we're looking at right now with a"], [3414.1, "cardiovascular damage from local pollution on New Yorkers."], [3419.1, "It still continues."], [3420.1, "We've documented it before, especially traffic pollution,"], [3424.1, "cardiovascular respiratory asthma."], [3426.1, "It's a real problem."], [3427.1, "Diesel particles are an antigen."], [3429.1, "So they not only have the toxic effects of fossil fuels with metals,"], [3436.1, "transition metals that cause oxidative stress, inflammation,"], [3440.1, "which underlies a lot of disease throughout the body."], [3443.1, "So it has systemic effects."], [3445.1, "So we're not just talking about -- I mean, asthma is a very big problem."], [3449.1, "And I'm not dismissing it, but I'm saying it goes beyond that."], [3453.1, "And in every New Yorker, not just people who have respiratory problems."]  capitalize"], [5243.2, "on the program. Right. And so the densely populated areas,"], [5246.4, "which have a lot of trucks and a lot of humans, are the ones who would have a higher particulate"], [5251.5, "matter too, because they have less trees. Well, I mean, in my district, which is Manhattan,"], [5260.2, "which is also a residential part of the city, also has a lot of high particulate matters,"], [5264.5, "especially with the FDR that's in my district. We have a lot of truck traffic in my district."], [5269.7, "And so we see a lot of pollution and we want to reduce those, that behavior, right? So"], [5277.6, "creating more exceptions to idling, I don't think would incentivize."], [5282.1, "My more complete testimony, I simply said that I thought that you should base fines"], [5288.3, "on the areas where there's the most air pollution versus necessarily concentrating them in one"], [5294.9, "area. All right. Thank you, Chair."], [5299.3, "Thank you, Councilmember, for your good questioning of this panel. That'll be all for this panel."], [5305.1, "We really appreciate the input that we got. I know Councilmember Epstein was asking about,"], [5310.7, "he asked you something, right, to get back to him or whatever."], [5313.6, "I think this was answered by... Oh, fine."], [5317.1, "And anything you need from the staff of the committee, Harvey, you know, we're at your"], [5323.5, "disposal, of course. And so, thank you. The next panel, Eric Goldstein, Natural Resources"], [5329.7, "Defense Council, last name Mendez, can't make out the first name, New York lawyers for the"], [5344.1, "public interest. Ryan, looks like, Loki. Okay. Representing himself? Yes."], [5365.5, "Kevin Kalish? What's that? Oh, okay. Well, he's... So, is that two witnesses?"], [5385.4, "Okay. Okay. All right. And Jonathan Goran, representing himself. Jonathan Goran? Okay."], [5406.8, "And any prepared statements or whatever? You know, written statements? Okay. That's fine."], [5415.4, "Yeah. We're going to switch it again and go from my right to my left. And so, it's my"], [5425.0, "pleasure to recognize... Cut it out. Good afternoon, Chair Gennaro"], [5433.7, "and... I'm supposed to say your name. Okay. Okay."], [5436.7, "Just go ahead. I'm Eric Goldstein from the Natural Resources"], [5440.1, "Defense Council. Thank you for your leadership on this and so many other environmental issues."], [5445.3, "The citizen complaint enforcement provision in the New York City Air Code was one of the"], [5450.6, "most innovative environmental laws ever passed by the city council and a good example of"], [5455.1, "the council's national leadership on environmental issues. Indeed, NRDC filed one of the earliest"], [5462.4, "citizen complaint enforcement actions more than 30 years ago when we chased after express"], [5467.8, "buses spewing black smoke along Madison Avenue and successfully were able to convince DEP"], [5475.1, "to enforce action against them. NRDC supports intros 11A, 48, 562, and 869A, all of which"], [5483.0, "enhanced the program's operations. But there is a need for additional reforms to the citizen"], [5488.2, "enforcement program. One challenge is that in recent years citizen activists have filed"], [5493.8, "so many complaints that this single section of law has placed an enormous burden on DEP"], [5499.7, "staff and hampered the agency from undertaking other environmental enforcement actions that"], [5504.6, "may be equal to or even higher priorities for the Mamdani administration. Second problem"], [5510.0, "is that at least historically citizen complaint filings have not sufficiently targeted environmental"], [5515.3, "justice communities where air pollution levels have been their highest. And perhaps the biggest"], [5520.6, "problem of the existing scheme is that it simply is not in too many instances had the"], [5525.6, "desired effect of changing behavior and stopping pollution. For too many violators of this law,"], [5531.4, "they continue to treat the statute and the fines simply as a cost of doing business."], [5536.5, "That's why one concept in intro 561A that we strongly support would provide an incentive"], [5542.1, "for vehicle operators to install less polluting equipment, although we believe this provision"], [5547.0, "needs further strengthening so that it will accomplish the objectives you are seeking to"], [5551.2, "achieve. Intro 561A attempts to address some of these issues but needs additional work."], [5557.7, "Please finish your thoughts because I gave you a hard time before."], [5561.8, "I will just say that while we do not support intro 561A in its current form,"], [5566.5, "we look forward to working with you to digesting all of the good testimony you've heard today"], [5571.3, "and to coming up with legislation that will enhance this very important program."], [5576.2, "Thank you very much, Eric. Yeah, I mean, we have to hear it. We have to get input if we're going to"], [5581.6, "get to where we need to be, and I appreciate your ongoing partnership on this and countless"], [5589.6, "other occasions. So thank you again for being here, and Ms. Mendez, right?"], [5597.6, "Yes, hi. Good afternoon, Chair Gennaro and Councilmember Epstein. My name is Sue Holly Mendez,"], [5604.9, "and I'm the policy and legislative coordinator at New York Lawyers for the Public Interests,"], [5608.9, "which I'll reference as NOBI from going forward. NOBI has three requests from the Council today."], [5616.8, "That is to pass intro 11 to strengthen penalties and enforcement against repeat violators,"], [5623.7, "pass intro 48 to expand language access and participation in the Citizens Air Complaint"], [5629.9, "Program, and reject the current iteration of intro 561A because of its broad exemptions"], [5637.4, "would undermine the enforcement and effectively weaken one of the city's most successful"], [5642.6, "anti-pollutions programs. NOBI works to advance environmental justice and clean air in communities"], [5650.4, "that bear this proportionate burden of the transportation pollution. And as someone who"], [5656.6, "was born as well as raised in the Bronx, I've seen firsthand how vehicle emissions affect"], [5662.2, "communities like mine, where residents live, work, and attend school near highways, truck routes,"], [5668.8, "and bus depots. Through our advocacy and research on school bus pollution, we have -- Oh, wow."], [5675.5, "Please continue. I have a soft spot for New York lawyers."], [5680.0, "Thank you. Thank you. We appreciate that. We've documented real harm caused by excessive idling,"], [5685.4, "illegal idling. It's not just the quality of life issue. It is a public health and"], [5689.6, "environmental justice issue. And that is why NOBI supports intro 11 and intro 48. Together,"], [5698.2, "these bills will strengthen enforcement, increase accountability, as well as expand access to"], [5703.6, "communities that are often the most impacted by transportation-related air pollution."], [5709.0, "Yeah, I think I'm going to have to -- Yeah."], [5711.0, "I mean, I got a soft spot, but it's not jello. I respect that."], [5715.9, "I will summarize by saying we urge the council to strengthen and not weaken New York City's"], [5720.6, "anti-idling laws by passing intros 11 and 48 and rejecting 5-6-1A. The public health comes"], [5728.2, "before polluter convenience, and environmental justice deserves stronger protections, not weaker"], [5734.1, "ones. And I thank you for your time and consideration. Thank you very much. And to"], [5740.8, "both witnesses, the first two, you know, you've been doing legislation for a long time,"], [5750.1, "and you have the bill, looked at it, you know, like it. I mean, we're all ears in terms of,"], [5757.8, "like, how would you write it? I mean, you know how to do legal language. I mean,"], [5763.7, "we're welcome to anything. People -- I mean, not anything, but, I mean, we're -- we want to work"], [5771.0, "collaboratively with the environmental community to get the best bill that we can get. And, you"], [5778.5, "know, we have to do something with 5-6-1. We got to -- something has to happen, because, like,"], [5785.2, "the status quo is, you know, not really working in an optimum way, and that's what we're trying"], [5793.1, "to achieve, so to the extent that, you know, we can get some New York lawyers and, you know,"], [5798.3, "NRDC brain power into, you know, off-rust language. It's just, like, nothing wrong with that."], [5806.0, "And we want to get from people that care about the environment, they care about, you know, pollution,"], [5811.6, "and, you know, we're not snobs about getting input on this is how we would do it, you know,"], [5821.3, "this is how New York lawyers, this is how NRDC would do it, you know, and we look forward to"], [5826.7, "further discussions on how we can sort of forge that partnership. So we're a team right now,"], [5833.3, "so that's it. You're conscripted. Sorry, you know. And -- Ryan, correct?"], [5848.1, "Sure. You just get the microphone nice and close. You got to put the button on. How's that?"], [5857.0, "Yep. Wonderful. Good afternoon, Chairman Gennaro and members of the committee. My name is Ryan"], [5861.9, "Scott Lokey. I'm a former delivery driver with more than 17 years of first-hand experience in"], [5866.5, "the operation and management of commercial motor vehicle fleets. Today I work as an environmental"], [5871.0, "consultant. I help small businesses understand city, state, and federal environmental regulations,"], [5876.1, "learn how to comply with these regulations, and how to resolve outstanding violations."], [5880.7, "I am also an active and regular participant in the city's civilian air, noise, and sanitation"], [5885.7, "enforcement programs. I have submitted and documented over 5,000 complaints in my experience."], [5891.7, "These experiences give me a unique perspective. I see firsthand how these enforcement programs"], [5896.3, "affect the small businesses, commercial drivers, civilian enforcers, and the environment."], [5901.3, "Based on that experience, I oppose intros 11A, 561A, 562, and 869A."], [5907.7, "I support intros 48 and resolution T2026, 2662. I did want to speak about intro 11A,"], [5915.7, "but we're very limited on time, so let me just focus on 561A, and most importantly,"], [5920.9, "the regeneration arguments made by the prior panel. For starters, in 561A, the most problematic"], [5928.8, "provision proposed is the proposed exemption for diesel vehicles undergoing diesel particulate"], [5933.0, "filter regeneration. That's also known as a DPF regeneration. The misstatements of fact in the"], [5941.3, "last panel are abhorrent. I assume the provision is well intentioned, but it's simply unworkable"], [5947.5, "in reality. With my extensive experience, over 17 years of firsthand experience, I can only estimate"], [5956.2, "whether a diesel vehicle is undergoing regeneration while outside the vehicle at maybe a 70 percent"], [5962.6, "accuracy rate, at least while observing it outside the vehicle. The smaller and newer the vehicle,"], [5968.0, "the more difficult that determination becomes. If someone with my level of experience cannot"], [5973.0, "reliably identify regeneration from outside a vehicle, I have no idea how we could reasonably"], [5978.2, "inspect an OATH hearing officer who may have little or no comparable experience with diesel"], [5982.5, "engines to make that determination. I'm happy to answer questions on how the actual process"], [5987.6, "regeneration works, but vehicles are absolutely able to regenerate in both an active and a passive"], [5993.2, "method. They do not have to pull over in most cases to be able to regenerate. They are able"], [5998.2, "to continue doing it while they drive. The statement that they have to pull over because"], [6002.3, "there's a magical light or something like that is asinine. It is true that vehicles and diesel"], [6008.4, "vehicles may have to have regeneration done at a particular time, but not in the manner that they"], [6013.5, "described. You made that point. I appreciate your being here. I appreciate all of your years of"], [6019.9, "experience and the experience that you bring to bear on this panel. With that, I'll call the next"], [6024.6, "witness. Both witnesses."], [6027.9, "What's the baby's name? Oh, I promised I wasn't gonna make a spectacle of it. Can I just keep"], [6037.4, "her private? Oh no, of course. Yeah, I just... No, no, because then it'd be on the record,"], [6042.2, "people would see it, you know, and whatever. Yeah. Yeah, I get it. Yeah. But she's a... You"], [6049.0, "can start it now. She's a bit of a witness to the fact that the CACP has made a difference,"], [6056.2, "at least where I live, in Eastern Queens, where I'm probably among the only participants in the"], [6062.2, "program. Whereas a few years ago, Con Ed would be on all the time, and if I was walking around the"], [6067.4, "neighborhood, before I knew about the program, be like, \"Oh, I got to cross the street to avoid,"], [6071.3, "you know, these stinky fumes, because I really don't like the stinky fumes. I don't like the"], [6074.5, "noise.\" And she doesn't like, you know, loud mechanical noises either. Now they're off. And,"], [6079.4, "you know, if the Consolidated Edison Company can do this, you know, if they can be resilient,"], [6085.1, "I mean, this one, it was her first time on the subway today, I think she's being very resilient."], [6088.4, "I don't understand why so many companies here can't modify their behavior accordingly, why"], [6094.8, "they want us to adapt our laws to them, as opposed to them adapting to, you know, the market of,"], [6101.8, "you know, the greatest city in the world. But really has made a difference, and we can walk"], [6108.0, "right past them, and she's not bothered at all. And I'm also a bit sensitive to noise,"], [6114.1, "and so I wanted to bring something to your attention. I don't think anyone else will."], [6118.8, "I used to prosecute some noise hearings. I really do not like when ice cream trucks just sit at a"], [6125.2, "corner, and you can hear them for blocks away, and they're just on and on and on, and the city"], [6128.4, "wouldn't do anything about it. I prosecuted, you know, a modest number of these complaints,"], [6134.1, "and I received a death threat in the mail from my efforts. And so, you know, I hear, \"Oh, you"], [6139.0, "should come up to the truck and tell us to turn off.\" I don't appreciate. Address the, you know,"], [6148.3, "address the council, please. Yeah, so, you know, I don't think that's fair for anyone to have to"], [6152.6, "experience, and DEP is trying to outsource a lot more of their efforts to us, and that's what this"], [6160.2, "would do with the specific timeline, saying, \"Okay, well, your work is either going to go"], [6164.3, "down the toilet, or you're going to have to put your name out there and be exposed to this.\" And"], [6169.0, "I really don't think that's fair to anybody. Well, I certainly appreciate the, you know,"], [6176.0, "personal testimony that you, you know, bring to bear as a resident, as a father, as someone who's"], [6183.2, "trying to, you know, make a better world for his child. And, you know, your testimony is very"], [6192.6, "impactful, and we, and you have participated in the program, right? I have, and it bore dividends,"], [6200.1, "and now I'm grateful for our walks that, you know, are quieter and cleaner. And I think, you know,"], [6205.7, "regarding, and it sounds like you live in Councilmember Lee's district? Correct. Yeah, so, you know,"], [6213.8, "we, back when I did the noise code in 2005, you know, we came to a grand compromise on the"], [6223.2, "ice cream trucks. They could only sound their bells when they're moving. When they stop,"], [6227.6, "they have to shut them off. Yeah. Can kids have ice cream radar? They know the truck is there."], [6232.9, "Right. I'm just saying, but it is currently illegal. We, like, we don't have to legislate"], [6237.8, "that. Like, that's been done. Oh, no, no, I know. So now it's on the enforcement side."], [6241.8, "Because, like, the city refused it. In fact, it, my local city council office, they call me the"], [6248.0, "Grinch because I actually didn't force it, which I'm perfectly fine with. But as a result of that,"], [6253.6, "you know, I got an anonymous death threat in the mail. From the, from the Mrs. Softy guy?"], [6259.2, "It was anonymous, so I'm not going to impugn anybody. But, but it's very likely the case"], [6266.4, "because I can, I can, I can explain. All right. I mean, yeah. So, so that, that, that's a saga"], [6272.8, "you should work out with council member Lee, who was very responsive. I'm sorry that that,"], [6279.2, "I'm sorry that that happened. That, that, that's, that's terrifying. That's terrifying. But"], [6284.7, "we really appreciate it better now. If you, if we go to a party in Nassau County, again,"], [6288.5, "that made a huge improvement. So both the noise, I mean, I don't participate in that anymore, but"], [6294.4, "there's a little less of a need because an impact was had beforehand. Good. Okay. I don't like,"], [6304.8, "this would require us to do more and get less in return. And in tech terms,"], [6309.2, "if you want to add a new term, that's, I'm sure never been used at a hearing here before in"], [6312.7, "shitification, that's what would be happening. Put that on the list. So in my view, I, six,"], [6317.8, "one is irreconcilable, irreconcilable. Okay. Thank you for your, thank you. Thank you for your"], [6324.2, "passionate testimony. Jonathan Gorin. Jonathan Gorin. Yeah. Good afternoon. My name is Jonathan"], [6334.3, "Gorin. I live in New York and I have asthma. So this directly impacts me. I do too. I had"], [6340.7, "something written up. However, I'm going to ditch that and address some of the claims I heard."], [6345.9, "Sure. Most prominently that I heard that vehicles are receiving tickets when they were engaged in"], [6353.9, "an active processing. Like when the vehicle was pumping or using a crane,"], [6359.5, "I heard that they were getting tickets. I want to take the time to remind the committee what"], [6363.7, "the law is right now and why that's not true. So reading directly from, reading directly from the,"], [6371.4, "the law section, the code section 24-163 operation of a motor vehicle. A, no person shall cause or"], [6380.4, "permit the engine of a motor vehicle other than a legally authorized motor vehicle to idle for"], [6385.8, "longer than three minutes, dot, dot, dot, excuse me, except as in providers subdivision F in the"], [6391.6, "section while parking, then it defines like it gives some more, more details, dot, dot, dot. And then it"], [6400.5, "gives exemptions. The exemptions are unless the engine is used to operate a loading, unloading,"], [6407.3, "or processing device. So your next question is what's a processing device? Well, luckily that's"], [6412.4, "defined in the rules title, I believe title 15 section 3901 processing device for the purposes"], [6426.8, "of section 24-163 of the admin code. The term processing device shall mean a, excuse me, one,"], [6434.2, "a device that accomplishes the function for which the vehicle or equipment was designed"], [6438.7, "other than transporting goods or people via a mechanical connection to the engine,"], [6443.2, "including, but not limited to, operating a lift, crane, pump, drill, hoist, or mixer."], [6452.5, "I'm going to leave my testimony at that. Thank you very much. Thank you. We are familiar with the"], [6458.4, "law, but we appreciate, you know, you getting that in-depth knowledge of the law and, you know,"], [6469.8, "calling out, what do you think needs to be called out? We certainly appreciate your patience and"], [6473.5, "your willingness to be here to give you good testimony. And that goes for the entire panel."], [6481.6, "Harvey, you got anything for this panel? I do, Jim, if that's okay. Yeah. Yeah. Yeah. Good. Thanks."], [6487.6, "Yeah. It's set at five minutes. Eric, you mentioned that you were open to some"], [6496.0, "changes to 561A to improve what processing of these complaints or?"], [6505.2, "Well, one thing that we believe needs to be enhanced is the timing. So you want to provide"], [6511.2, "sufficient time for timing for when people get notified of them. Exactly. So, I mean, there are"], [6518.1, "a number of small fixes that can improve this, which is, I think, what most of us are after."], [6524.2, "Yeah, basically. So it sounds like we want businesses to know because that's how you change"], [6527.7, "behavior. If you wait a year, the driver might be gone. You want them to have quick notice of this"], [6534.5, "so they can try to change behavior, but not change the underlying idling law. Is that what I heard you"], [6541.7, "saying? Yeah. That certainly is one of the elements that we think should be addressed. Right. So,"], [6546.8, "does anybody disagree on this panel that we should notify the businesses sooner that there's a"], [6552.5, "violation? We can say it orally so we can, it's on the record. We all agree they should be notified"], [6561.3, "earlier. We all agree they should be notified earlier, which is great. So it sounds like we"], [6565.8, "agree they should be notified earlier on that there are existing exemptions within the law"], [6571.6, "for when they're doing their work. Is that what I heard you say? That is correct. So,"], [6577.3, "if they're actively doing something, regeneration, obviously, is a different conversation. It sounds"], [6582.2, "like you have really specific knowledge about how regeneration works and what we heard from the last"], [6588.4, "panel may not be exactly the way you understand it, right? Yeah. Could you please? So, essentially,"], [6597.1, "the last panel failed to mention the fact that there is a difference between active and passive"], [6601.2, "regeneration. Active is the actual activity when you would pull over and you would quite literally"], [6608.0, "manually activate a regeneration cycle. On older trucks, it is true that some trucks,"], [6613.4, "unfortunately, you do have to pull over and you will have to manually hit a button."], [6617.2, "When you do that, what it does is it superheats the DPF and essentially burns off all of the"], [6624.4, "chemicals that have been stored inside of this diesel particulate filter. On most of these newer"], [6629.2, "vehicles, however, and by newer, I mean pretty much anything after 2009, they also have the"], [6634.5, "ability to do a passive regeneration. What that means is as the vehicle is simply driving around"], [6640.0, "at highway speeds or, you know, on the west side highway or anything else, as they're driving"], [6644.8, "around, it is literally burning off the excess chemicals in the DPF filter. I do want to note when"], [6650.8, "they actually go through the activity of doing an active regeneration, that regeneration is almost"], [6656.0, "30 times dirtier than a passive regeneration. At no point should anybody be doing an active"], [6661.2, "regeneration in a heavily populated area. It's as simple as that. It's incredibly dirty. It's very"], [6666.7, "dangerous for the health and humans in general and it should not be done near populated areas. It's"], [6671.4, "actually so dangerous that if you read the DPF filters for modern trucks, they specifically warn"], [6676.8, "you, A, not to do it in your populated areas and they also warn you not to do it near anything"], [6680.7, "combustible or flammable, specifically because of the high heats and the chemicals admitted."], [6686.7, "I do also just want to note that there is a, this would create almost a situation where"], [6694.9, "there would be a un-rebuttable presumption. All a industry respondent would have to claim is,"], [6700.7, "we're regenerating. And guess what? How do we go about disproving it? Most people,"], [6706.1, "even with my experience, I can maybe get it to 70%, the average hearing officer or citizen"], [6710.9, "complaint or anybody else who has had no experience with diesel trucks beyond filming or seeing them"], [6716.4, "on the road, how are they ever going to determine that a vehicle is regenerating?"], [6719.9, "So you're saying it would just destroy the whole law itself if we could create an exception"], [6726.2, "for regeneration because all any defense would be as we're regenerating and it would be impossible"], [6732.7, "to disprove their regeneration. Exactly. So that would result in more idling because people would"], [6738.2, "just always use that defense. And I would also note that this benefits the biggest respondents"], [6743.4, "the most. And what I mean by that is large truck and large bus companies. So a smaller operation"], [6748.4, "almost always, like most of my clients, small businesses, usually if you have less than 10"], [6753.1, "trucks, it is very common to have gasoline engines simply because they're cheaper up front,"], [6757.2, "cheaper to maintain over the long term, and the fuel is honestly cheaper. Gasoline vehicles would"], [6763.3, "not be able to endure themselves with this particular exemption, but guess who would?"], [6766.8, "Large companies like Baldor, Academy Bus and things like that that operate thousands of diesel"], [6771.6, "engines. Got it. So it sounds like I understand this and thank you, Chair, for letting me ask"], [6778.6, "a couple of questions here. Yeah, you've got a little more. I think I'm good. I'll give you"], [6784.5, "15 seconds back. I'm not going to give you a hard time, Harvey. Just, you know, do what you got to"], [6791.2, "do. Yeah, good. Okay. Yeah, I really want to thank this panel for their, you know, very excellent"], [6798.9, "testimony and, and Ryan, didn't you meet with us and numerous times? ow? Particularly me, you know? No one knows what I'm gonna do."], [7273.8, "Oh, this is all on the record, of course. Yeah, this is great. Okay. Okay. And so, very happy to welcome back to the Council, former Council Member Liz Crowley."], [7288.8, "Yeah. Well, we're not, you know, I'm not, yeah. Oh, of course, I called the panel. So this is Samuel, right? Okay. All right. All right. And so, Sergeant looks like Liz is ready to go. And so I'm gonna give her the privilege of going first."], [7312.8, "And so, Liz, very, you know, super to see you again, and please proceed with your good testimony. Good afternoon, Chair Gennaro, the members of the committee. I know Council Member Harvey Epstein was here and the other. Yeah, he's talking to witnesses outside. He's further interrogating."], [7332.8, "And all the Council Members on the committee and the committee staff, thank you for the good work you do, your commitment of public service, the environment, and cleaner air."], [7343.8, "And thank you for allowing me to testify today and this opportunity to speak. My name is Elizabeth Crowley and I'm here today. I am the President and CEO of the Building Trades Employers Association."], [7356.8, "I have our Director of Member Services here as well, Samuel Aluto."], [7362.8, "The BTA is a union contractor association. We're an umbrella association that covers over 24 separate associations. And together there's over 1200 contractors that we represent. Many are small family owned businesses."], [7378.8, "Many are also MWBEs and emerging contractors."], [7382.8, "We share the Council's commitment to cleaner air."], [7386.8, "We support the core reforms in intro 561A as well as intro 562 and proposed intro 869A, but we cannot support intro 11A as drafted."], [7402.8, "Our written testimony submitted today is more extensive and includes recommendations for each bill."], [7410.8, "The union contractors are proud to be paying higher wages and they are among the safest and most are community minded employers and the best in their class, best in the industry."], [7425.8, "And we're proud of that. We're proud of the high standards our contractors set, not only for themselves, but their whole entire workforce."], [7434.8, "We live in your districts. Many of us are small businesses, as I said earlier, and we really care about our neighbors."], [7442.8, "Liz, please continue. You get the former Councilmember bonus."], [7448.8, "Thank you. With the cost of doing business --"], [7451.8, "My Council told me not to say that, but after I said it, so --"], [7456.8, "I appreciate this. I won't be too much longer, but with the cost of doing business in the city so high, our contractors are very conscientious about wasting resources when their trucks are running."], [7470.8, "And it's often because the engine is needed to do a job like running a liftgate, lighting the job site, powering a crane, a pump compressor, generator, the warning lights that protect a work zone, and even the decontamination showers that OSHA requires for those that are working on our bestest and lead abated jobs."], [7491.8, "These functions cannot always be shut off between cycles without creating safety risks."], [7498.8, "However, our contractors are often penalized for doing the work that is required of their job."], [7504.8, "intro 561A's new processing device definition is a good step, but it covers only equipment mechanically connected to the engine."], [7512.8, "We ask that the Council -- for the Council to define operational idling to include traffic control devices, generators, decontamination units, and the pauses safe operation requires, and to presume that when it is operating, it is visible work on the way."], [7532.8, "Drivers waiting to enter a job site in extreme cold or heat also need a safe cab. intro 561A lets school buses idle for up to 30 minutes below 40 degrees and/or at 80 or above."], [7546.8, "We believe our workers deserve a comparable exception."], [7552.8 y equipment operation, including refrigerated units and loading and unloading devices."], [7790.8, "Exempts require diesel particulate filter regeneration, which a report can be generated by the vehicle's ECM to prove if it was in regen or if it was not in regen."], [7802.8, "And in addition to that, we support Intro 562. Rental leasing companies should not bear responsibility for conduct they cannot control."], [7811.8, "Transfer liability must be simple, affordable, and operational before penalties rise. We support Intro 869A's protections against fraudulent evidence and complaint misconduct."], [7820.8, "We oppose Intro 11A's penalty increase at this time, advance the reforms first, restore accountability, and especially due process, evaluate the results before increasing penalties."], [7832.8, "We look forward to working with the council and DEP on improvements, and I look forward to your questions."], [7837.8, "Thank you, Zach. I appreciate it. And Mr. Zogby, a pleasure to see you again."], [7842.8, "Thank you very much. My name, thank you for the opportunity to testify. My name is Larry Zogby, the CEO of RDS Delivery Service."], [7849.8, "We handle time critical medical deliveries for hospitals and laboratories, including specimens, medication, and essential supplies."], [7856.8, "We also deliver thousands of food boxes to New Yorkers facing food insecurity."], [7861.8, "I've served five years as the president of the New York State Messenger Career Association, also involved with the Trucking Association of New York,"], [7868.8, "the Queens Chamber of Commerce, the Long Island City Partnership, Executives Association of New York, and Entrepreneurs Organization of New York City."], [7875.8, "I speak only for RDS, but these concerns go beyond myself, my business, my community."], [7881.8, "Thirty selected idling summonses from 2020 through 2025 over $32,000 in fines and penalties."], [7888.8, "Hearings were scheduled 500, 700, and 962 days after the violation. T . Hello. Thank you for being here. I'm dedicating my testimony to my beloved neighbor,"], [15450.8, "Ms. Pam Bynow, who is permanently disabled from the asthma that she developed after moving"], [15454.7, "here from Barbados. My name is Josh Bisker. I'm a former delivery driver, a long time"], [15458.7, "participant in the citizen's air complaint program, and a born New Yorker who has had"], [15462.7, "asthma since childhood. I have the expertise to comment on today's bills and their stakes"], [15466.7, "are deeply personal. Intro 561A will effectively destroy the citizen's air complaint program."], [15472.7, "It will protect corporate polluters with legal loopholes, hamper city agencies from holding"], [15477.2, "them accountable, disincentivize public participation, and possibly retroactively void a vast number"], [15482.9, "of outstanding complaints. I studied behavioral economics in urban planning at Hunter College,"], [15495.9, "so I understand that the current air complaint program ingeniously pairs up to financial"], [15500.6, "incentive mechanisms. Penalties for idling get corporations to stop polluting. Rewards"], [15505.9, "from those penalties get members of the public to contribute complaints. 561A throws a wrench"], [15511.3, "into both mechanisms. It effectively rewards polluters for having polluted so much that"], [15516.3, "they gummed up the system and punishes citizens for having participated so avidly. The lesson"], [15521.3, "is that more polluting wins more allowances for polluting, yet more participation is a"], [15525.0, "waste of the public's time and effort. 561A encourages polluting and ruptures the public's"], [15529.9, "trust in our government. All future city programs asking the public to participate in oversight"], [15534.7, "will suffer, and in the meantime, the city, possibly, forfeits tens of millions of dollars"], [15540.5, "in corporate environmental fees. I once felt hopeless about the FedEx trucks that idle"], [15545.2, "on my bl ical stuff in my written testimony. Thank you very much. And I'm available for"], [18741.5, "anything else. We really appreciate that. Thank you. Next witness, Alice Mach. You may"], [18754.0, "begin. I'm not present. Jim Whalen, Teamsters. You may begin. Good afternoon. I'm Jim Whalen."], [18775.6, "I'm here on behalf of Teamsters Local 817, the crew that keeps New York City film and"], [18779.9, "TV industry moving. When you spot a production crew parked on a New York City street, you"], [18785.1, "might see a bunch of trucks and trailers, but you're actually looking at a mobile factory,"], [18790.0, "generating a lot of money for our city and providing good union paying jobs. It's a manufacturing"], [18795.5, "plant on wheels with a massive logistics footprint. It rolls into neighborhoods overnight, sets"], [18801.3, "up assembly lines for lights, camera, and action, and crafts a final piece of Cinemagic"], [18806.4, "Art. So we are lucky and privileged to use New York City as a studio backlot. Our trucks"], [18811.6, "are packed with specialized equipment. Like any factory, we need large commercial vehicles"], [18816.6, "to transport equipment and provide power for film sets, which brings us to a big hurdle."], [18823.1, "New York City's strict anti idling laws. If you can imagine a regular brick and mortar"], [18829.8, "factory that had to shut down every three minutes, it just wouldn't work. In my opinion, this"], [18835.1, "law lacks due process and transparency. There is no immediate notification, sometimes between"], [18840.8, "six to nine months before we see a summons. With this, it's impossible to gather evidence"], [18847.5, "for defense. Third, we are seeing deceptive bounty hunter tactics, like filming exempt"], [18854.2, "vehicles while hiding the fact that the liftgate is in use. Plus, the law seems to violate"], [18860.0, "equal protection by shielding city and state owned vehicles that are usually exempts. Fines"], [18866.8, "usually affect the local small trucking companies that service our industry as well as major"], [18871.6, "studios that produce film and TV shows. Our employers are frustrated and have attempted"], [18877.4, "to shift these fines onto our hardworking members of teams as Local 817. We fully understand"], [18883.1, "the health and environmental perks of cutting and mission, but these rigid rules also take"], [18888.2, "a physical toll on our drivers during extreme weather. New York winters are freezing and"], [18893.2, "summers are scorching, and yet running an engine for heat or AC isn't an allowed exception."], [18900.4, "For drivers in our industry who spend hours in stationary cabs waiting for the day to"], [18904.7, "end, it's tough. The law forces a brutal choice to endure unsafe cabin conditions or face"], [18911.5, "steep fines. Thank you, your time has expired. Thank you, Mr. Whalen. Thank you. I really"], [18922.8, "appreciate you and all the teamsters and all you do. Thank you."], [18935.4, "Next witness, Louis Dubouquet. You may begin. Good afternoon, Chair Gennaro and members of"], [18944.5, "the committee. My name is Lou Dubouque, and I'm representing the New York City chapter"], [18947.9, "of the National Waste and Recycling Association. Our industry supports improving air quality"], [18953.5, "and reducing unnecessary emissions. However, we have serious concerns about how the city's"], [18958.3, "idling laws are being enforced. Let me give you three examples. First, our members are"], [18964.3, "receiving idling tickets while actively collecting garbage simply because the compactor blade"], [18969.2, "isn't moving. Does the city really want operators running their compactor blade every three"], [18974.6, "minutes, whether necessary or not, just to avoid a ticket? This absolutely makes no"], [18980.2, "sense. Second, our members have received tickets during diesel particulate filter regeneration,"], [18986.8, "a necessary process that actually reduces emissions. Some have been told to drive back"], [18992.3, "to their yards to complete regeneration, then return to their routes. How does driving additional"], [18997.7, "miles across the city improve air quality? Finally, a member received a ticket while"], [19003.7, "waiting for a car and bicyclist to pass. The driver was operating safely and was penalized"], [19009.0, "for it. We appreciate the intro of 561A that it addresses diesel regeneration in the citizen"], [19016.7, "complaint process. However, the legislation needs to go further. We urge the council to"], [19022.6, "explicitly protect vehicles throughout the active collection process, required regeneration"], [19027.4, "cycles and temporary stops necessary for public safety. Our members should not have to choose"], [19032.5, "between complying with idling regulations, operating their equipment properly and protecting"], [19037.3, "public safety. We support cleaner air, but enforcement needs to reflect how our industry"], [19042.9, "actually operates. We will be submitting more detailed written testimony. Thank you for"], [19048.2, "your time today. Thank you very much. That was a very compelling testimony about what"], [19054.7, "your industry has gone through, and it is a welcome addition to all of the information"], [19064.8, "that we have received today. Thank you, Chairman. You bet. Thank you. Best to you. Next witness"], [19074.3, "is Christian Farmer. Next witness, Patrick Thomas Schnell. Good afternoon. My name is"], [19098.5, "Patrick Schnell, and I used to start out my testimonies by stating that I'm a board-certified"], [19103.3, "pediatrician and list the adverse health impact of traffic-related air pollution, but I've"], [19108.3, "learned over time that hardly anyone cares about the impact of air pollution on human"], [19112.7, "health. In fact, intro 561 is prime evidence for the fact that whoever drafted it is entirely"], [19119.4, "uninterested in the protection of human health, let alone the environment. To th
